const SHARE_URL=(location.protocol==="https:")?location.href.split("#")[0].split("?")[0]:"https://mariana-li.github.io/apps/vitals/";
let shareBlob=null, shareFor=null;

function rr(x,px,py,w,h,r,fill){ x.beginPath(); x.roundRect(px,py,w,h,r); x.fillStyle=fill; x.fill(); }
/* Greedy wrap that breaks on spaces for English and between characters for
   Chinese, which has none. */
const CJK=/[\u2E80-\u9FFF\uF900-\uFAFF\uFF00-\uFF60\u3000-\u303F]/;
function wrapCanvas(x,text,maxW){
  const lines=[]; let cur="";
  for(let i=0;i<text.length;i++){
    const ch=text[i], test=cur+ch;
    if(cur && x.measureText(test).width>maxW){
      if(ch===" "){ lines.push(cur); cur=""; continue; }
      if(CJK.test(ch)||CJK.test(cur[cur.length-1])){ lines.push(cur); cur=ch; continue; }
      const sp=cur.lastIndexOf(" ");
      if(sp>0){ lines.push(cur.slice(0,sp)); cur=cur.slice(sp+1)+ch; }
      else { lines.push(cur); cur=ch; }
    } else cur=test;
  }
  if(cur.trim()) lines.push(cur.trim());
  return lines;
}
function svgToImage(svgEl){
  return new Promise(res=>{
    if(!svgEl) return res(null);
    const clone=svgEl.cloneNode(true);
    const vb=(clone.getAttribute("viewBox")||"0 0 320 150").split(/\s+/).map(Number);
    clone.setAttribute("width",vb[2]*3); clone.setAttribute("height",vb[3]*3);
    clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
    const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone)],{type:"image/svg+xml"}));
    const img=new Image();
    img.onload=()=>{ URL.revokeObjectURL(url); res({img,w:vb[2],h:vb[3]}); };
    img.onerror=()=>{ URL.revokeObjectURL(url); res(null); };
    img.src=url;
  });
}
const FD='Fredoka, sans-serif';
const NU='Nunito, sans-serif';

/* The card carries the whole fact: headline, picture, why, and the steps.
   Height is measured first and the canvas sized to fit, so nothing is cut off.
   Buttons and the streak are page furniture and stay off it. */
async function buildShareCard(f0){
  const f=txt(f0);
  const W=1080, pad=72, ix=pad+52, iw=W-pad*2-104, x0=L();
  if(document.fonts&&document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }

  const m=document.createElement("canvas").getContext("2d");
  m.font="500 66px "+FD;            const titleLines=wrapCanvas(m,f.t,iw);
  m.font="400 37px "+NU;            const whyLines=wrapCanvas(m,f.w,iw);
  m.font="400 35px "+NU;
  const steps=(f.a||[]).map(t=>wrapCanvas(m,t,iw-72));
  const art=await svgToImage(document.querySelector("#art svg"));

  const TL=82, WL=52, SL=48;
  let artH=0, artW=0;
  if(art){ const sc=Math.min((iw-60)/art.w,520/art.h); artW=art.w*sc; artH=art.h*sc; }

  let y=110+120+54;                       /* card top, header bar, gap */
  const yChip=y;            y+=56+38;
  const yTitle=y;           y+=titleLines.length*TL+(art?30:34);
  const yArt=y;             if(art) y+=artH+40+34;
  const yWhyLbl=y;          y+=34+16;
  const yWhy=y;             y+=whyLines.length*WL;
  let yDoLbl=0, yStep=0;
  if(steps.length){ y+=34; yDoLbl=y; y+=34+18; yStep=y;
    steps.forEach(ls=>{ y+=ls.length*SL+22; }); }
  y+=36;
  const yFoot=y;            y+=34+52;
  const H=Math.round(y+110);

  const c=document.createElement("canvas"); c.width=W; c.height=H;
  const x=c.getContext("2d");
  x.fillStyle="#16213A"; x.fillRect(0,0,W,H);
  rr(x,pad,110,W-pad*2,H-220,44,"#F0EDE6");
  x.save(); x.beginPath(); x.roundRect(pad,110,W-pad*2,120,[44,44,0,0]); x.fillStyle="#2E4269"; x.fill(); x.restore();

  x.textBaseline="middle";
  x.fillStyle="#F3F0EA"; x.font="500 46px "+FD; x.fillText("Vitals",ix,170);
  const now=new Date();
  x.textAlign="right"; x.fillStyle="#A3B4CC"; x.font="600 30px "+NU;
  x.fillText(x0.cardDate(now.getDate(),now.getMonth(),now.getFullYear()),W-pad-52,170);
  x.textAlign="left";

  const cat=CATS[f.cat], label=catLabel(f.cat);
  x.font="600 30px "+FD;
  const cw=x.measureText(label).width+64;
  rr(x,ix,yChip,cw,56,28,tint(cat.color,.12));
  x.fillStyle=cat.color; x.fillText(label,ix+38,yChip+28);
  x.beginPath(); x.arc(ix+22,yChip+28,6,0,7); x.fill();

  x.textBaseline="top";
  x.fillStyle="#22355C"; x.font="500 66px "+FD;
  titleLines.forEach((ln,i)=>x.fillText(ln,ix,yTitle+i*TL));

  if(art){
    rr(x,ix,yArt,iw,artH+40,36,"#FAF8F3");
    x.drawImage(art.img,ix+(iw-artW)/2,yArt+20,artW,artH);
  }

  x.fillStyle="#C64A31"; x.font="600 26px "+FD;
  x.fillText(x0.why.toUpperCase(),ix,yWhyLbl);
  x.fillStyle="#3C5B86"; x.font="400 37px "+NU;
  whyLines.forEach((ln,i)=>x.fillText(ln,ix,yWhy+i*WL));

  if(steps.length){
    x.fillStyle="#C64A31"; x.font="600 26px "+FD;
    x.fillText(x0.doThis.toUpperCase(),ix,yDoLbl);
    let sy=yStep;
    steps.forEach((ls,n)=>{
      x.fillStyle=tint(cat.color,.14); x.beginPath(); x.arc(ix+17,sy+18,17,0,7); x.fill();
      x.fillStyle=cat.color; x.font="600 24px "+FD; x.textAlign="center";
      x.fillText(String(n+1),ix+17,sy+7); x.textAlign="left";
      x.fillStyle="#232833"; x.font="400 35px "+NU;
      ls.forEach((ln,i)=>x.fillText(ln,ix+56,sy+i*SL));
      sy+=ls.length*SL+22;
    });
  }

  x.fillStyle="#7788A3"; x.font="600 28px "+NU;
  x.fillText(x0.tagline,ix,yFoot);
  x.fillStyle="#C64A31"; x.font="600 30px "+FD;
  x.fillText(SHARE_URL.replace(/^https?:\/\//,"").replace(/\/$/,""),ix,yFoot+42);
  return new Promise(res=>c.toBlob(res,"image/png"));
}
async function prepareShare(){
  const f=viewing; if(!f) return;
  shareFor=f.id; shareBlob=null;
  try{ const b=await buildShareCard(f); if(shareFor===f.id) shareBlob=b; }catch(e){ shareBlob=null; }
}
async function shareNow(){
  const f=viewing, btn=el("share"), lab=el("shareLabel");
  btn.disabled=true; lab.textContent=L().preparing;
  try{
    let blob=(shareFor===f.id&&shareBlob)?shareBlob:await buildShareCard(f);
    const file=new File([blob],"vitals-"+f.id+".png",{type:"image/png"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:"Vitals",text:f.t});
    }else if(navigator.share){
      await navigator.share({title:"Vitals",text:f.t,url:SHARE_URL});
    }else{
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=file.name; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    }
  }catch(e){ /* user closed the share sheet, or not supported */ }
  btn.disabled=false; lab.textContent=L().share;
}
el("share").onclick=shareNow;

/* ── optional review controls, present only in the mockup build ── */
const opt=id=>document.getElementById(id);
if(opt("next")){

let viewing=null, isToday=true, todayFact=null;

function render(){
  const f=viewing, now=new Date();
  el("period").textContent=L().period(now.getMonth(),now.getFullYear());
  el("num").textContent=now.getDate();
  el("num").classList.toggle("sun",now.getDay()===0);
  el("dow").textContent=L().dow(now.getDay());
  const d=txt(f);
  const cat=CATS[f.cat];
  el("chipLabel").textContent=catLabel(f.cat);
  el("chip").style.color=cat.color;
  el("chip").style.background=tint(cat.color,.10);
  el("chipDot").style.background=cat.color;
  el("fact").textContent=d.t;
  el("art").innerHTML=artFor(f);
  el("why").textContent=d.w;
  el("openLabel").textContent=d.a?L().whyDo:L().whyQ;
  el("doWrap").hidden=!d.a;
  el("doList").innerHTML=(d.a||[]).map((s,n)=>'<li><b>'+(n+1)+'</b><span>'+s+'</span></li>').join("");
  el("panel").classList.remove("open");
  el("openBtn").setAttribute("aria-expanded","false");

  const on=state.saved.includes(f.id);
  el("save").classList.toggle("on",on);
  el("saveLabel").textContent=on?L().saved:L().save;
  el("savedCount").textContent=state.saved.length;
  el("streak").textContent=state.streak>1?L().streak(state.streak):L().dayOne;
  el("backToday").hidden=isToday;
  applyChrome();
  if(opt("counter")) opt("counter").textContent=(ORDER.indexOf(f)+1)+" / "+ORDER.length+"  ·  "+(ORDER.length-state.seen.length)+" unseen";
  prepareShare();

  renderSheet();
}
/* Text that does not depend on which fact is showing. */
function applyChrome(){
  const x=L();
  document.documentElement.lang = (state.lang==="zh") ? "zh-CN" : "en";
  el("langLabel").textContent=x.toggle;
  el("whyLbl").textContent=x.why;
  el("doLbl").textContent=x.doThis;
  el("sheetTitle").textContent=x.savedTitle;
  el("savedPillLabel").textContent=x.savedTitle;
  el("backToday").textContent=x.backToday;
  el("shareLabel").textContent=x.share;
  el("fine").textContent=x.fine;
}
el("langBtn").onclick=()=>{
  state.lang = state.lang==="zh" ? "en" : "zh";
  persist();
  shareFor=null; shareBlob=null;   /* card text is language specific, build it again */
  render();
};

function renderSheet(){
  const b=el("sheetBody");
  if(!state.saved.length){ b.innerHTML='<p class="empty">'+L().nothingSaved+'</p>'; return; }
  const groups={};
  state.saved.forEach(id=>{ const f=BY_ID[id]; if(f) (groups[f.cat]=groups[f.cat]||[]).push(f); });
  const keys=Object.keys(CATS).filter(k=>groups[k]);
  b.innerHTML=keys.map(k=>{
    const c=CATS[k].color;
    return '<div class="grp">'+
      '<span class="ghead" style="color:'+c+';background:'+tint(c,.10)+'">'+
        '<s style="background:'+c+'"></s>'+catLabel(k)+'<b>'+groups[k].length+'</b></span>'+
      '<ul style="border-color:'+tint(c,.28)+'">'+
        groups[k].map(f=>'<li><button type="button" data-id="'+f.id+'">'+txt(f).t+'</button></li>').join("")+
      '</ul></div>';
  }).join("");
}
el("sheetBody").addEventListener("click",e=>{
  const btn=e.target.closest("button[data-id]"); if(!btn) return;
  const f=BY_ID[btn.dataset.id]; if(!f) return;
  el("sheet").hidden=true;
  show(f, todayFact && f.id===todayFact.id);
});
el("backToday").onclick=()=>show(todayFact,true);

function show(f,today){
  const p=el("page"); p.classList.add("tearing");
  setTimeout(()=>{ p.classList.remove("tearing"); viewing=f; isToday=!!today; render(); window.scrollTo({top:0}); },450);
}

el("openBtn").onclick=()=>{
  const o=el("panel").classList.toggle("open");
  el("openBtn").setAttribute("aria-expanded",o?"true":"false");
};
el("save").onclick=()=>{
  const id=viewing.id, i=state.saved.indexOf(id);
  if(i>=0) state.saved.splice(i,1); else state.saved.push(id);
  persist(); render();
};
el("savedPill").onclick=()=>{ el("sheet").hidden=!el("sheet").hidden; };

(async()=>{
  await loadState();
  updateStreak();
  todayFact=factForToday();
  viewing=todayFact; isToday=true;
  render();
})();
