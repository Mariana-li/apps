"sleep-apnea-snoring":{t:"打鼾很响并伴有呼吸暂停，是医学问题，不是笑话。",
 w:"气道反复塌陷，血氧下降，大脑短暂清醒到足以把它重新打开，一晚上有时会发生几百次。这会升高血压和中风风险。",
 a:["如果同床的人见过你呼吸停止，或者你睡了 8 小时醒来仍然不解乏，就去要求做睡眠检查。",
    "很多人改成侧卧而不是仰卧，症状就会减轻。"]},

"blue-light-vs-late":{t:"夜里的手机，问题主要出在你用它做什么。",
 w:"屏幕的光确实会压制褪黑素这种黑暗激素，但在手机正常亮度下影响很小。多投入一小时，比光的颜色让你少睡得多。",
 a:["设一个关机时间，而不是开夜间模式。定一个点，把手机放到床上够不到的地方充电。",
    "如果需要闹钟，买一个 10 美元的闹钟。这样就没有理由把手机放在伸手可及的地方。"]},

"bedroom-temperature":{t:"要入睡，你的体温得下降约一度。",
 w:"所以凉爽的房间有帮助，闷热的没有。大多数人适合 18 度左右。",
 a:["睡前一小时洗个热水澡，走的是相反的逻辑：血液流向皮肤，之后身体降温反而更快。"]},

"salt-in-food":{t:"你摄入的盐有 70% 在买回来之前就已经在食物里了。",
 w:"面包、火腿、奶酪、酱料和外卖占了大头。餐桌上的盐瓶只是一小部分，所以把它收起来几乎改变不了总量。",
 a:["看标签要看每 100 克，而不是每份。超过 1.5 克算高，低于 0.3 克算低。",
    "把其中两样高盐的换成低盐版本，效果胜过在餐桌上再小心。通常是面包和一种酱料。",
    "给自己两周时间。一旦不再往上加盐，你对咸味的偏好就会下降。"]},

"potassium-blood-pressure":{t:"钾能部分抵消盐对血压的影响。",
 w:"目标是每天约 3,500mg，而大多数人远远不够。",
 a:["一个烤土豆约 900mg，一杯豆子 750mg，一根香蕉 420mg。",
    "如果你有肾病，情况就不一样了。增加钾之前先问医生。"]},

"fibre-gap":{t:"大多数成年人吃到的膳食纤维，只有需要量的三分之二左右。",
 w:"大约 17 克，而目标是 27 克。肠道细菌吃掉纤维，把它变成滋养肠壁的燃料。没有纤维，肠壁就在挨饿。",
 a:["用两周时间慢慢加。突然增加正好会引起腹胀，让人半途而废。",
    "豆类、燕麦，以及果蔬带皮吃，比任何补充剂都管用。"]},

"water-eight-glasses":{t:"八杯水的说法从来没有证据支持。",
 w:"它似乎源自 1945 年的一条建议，那条建议把食物里的水也算在内，后来在转述中被略去了。你摄入的水分约有四分之一来自吃的东西。",
 a:["尿液呈淡麦秆色就没问题，深黄色就该喝水。这比数杯数可靠。"]},

"fullness-20-minutes":{t:"饱腹信号大约会迟到 20 分钟。",
 w:"胃和肠道分泌的激素要经血液运到大脑。吃得比这更快，你会在不知不觉中吃过了舒服的界线。",
 a:["每吃一口就把叉子放下。一顿饭吃满 20 分钟，信号才来得及在你吃过头之前赶上。",
    "想添第二碗，先等 10 分钟再盛。多数时候你就不想要了。"]},

"b12-sources":{t:"维生素 B12 由细菌制造，不是植物或动物造的。",
 w:"动物把它积累在体内，所以它通过肉、蛋、奶制品，或添加了 B12 的食品到达你身上。肝脏储存的量够用好几年，所以缺乏可以长期隐藏，最后以神经损伤的形式显现。",
 a:["完全不吃动物性食品，就必须每天吃补充剂或添加了 B12 的食品，这不是可选项。",
    "糖尿病药二甲双胍，以及长期服用的抑酸药，都会减少吸收量。吃其中任何一种，都值得查一次血。"]},

"fat-soluble-vitamins":{t:"有四种维生素会在体内蓄积，其余的会被排出。",
 w:"A、D、E 和 K 溶于脂肪，储存在肝脏和脂肪组织里，所以大剂量会累积到有害的水平。B 和 C 溶于水，当天就随尿排出。",
 a:["查看补充剂标签上的维生素 A、D、E 和 K，如果同时吃多种产品，要把总量加起来。",
    "维生素 A 每天超过 3,000 微克，或维生素 D 每天超过 100 微克，就是开始出现危害的界线。"]},

"vitamin-d-latitude":{t:"在北欧，冬天的太阳太低，晒不出维生素 D。",
 w:"太阳在天空中的位置太低，需要的那种光照不到皮肤。大致在马德里以北的地方，10 月到次年 3 月都晒不到有用的量。",
 a:["北方的冬天是最该补充的情形。通常的公共建议是每天 10 微克。",
    "肤色较深的人要晒更久才能得到同样的量，所以更容易不足。"]},

"iron-absorption-vitamin-c":{t:"维生素 C 能把植物性餐食中吸收到的铁提高到三倍。",
 w:"植物中的铁是肠道不易吸收的形式。维生素 C 把它转换成更容易穿过肠壁的形式。",
 a:["在豆子或菠菜上挤点柠檬，或者把水果随餐吃，而不是饭后吃。",
    "随餐喝茶和咖啡会减少铁的吸收。把它们挪到饭前或饭后一小时。"]},

"calcium-and-bone":{t:"光靠钙不能造出强壮的骨头，负重才行。",
 w:"钙是原料，但骨头只在受力的部位把它沉积下来。所以宇航员即使饮食完美，在轨道上仍然会流失骨量。",
 a:["只要脚落到地面的活动都算：走路、爬楼梯、跳舞、跳绳。",
    "游泳和骑车对身体有益，但对骨头几乎没用。"]},

"protein-spread":{t:"身体没法把多余的蛋白质存起来以后用。",
 w:"超出当下所需的部分会被当作能量烧掉或转成脂肪，所以一顿丰盛的晚餐补不回一整天的缺口。",
 a:["把蛋白质分摊到各餐，比堆在一餐里更有用，60 岁以上尤其如此。"]},

"wholegrain-vs-refined":{t:"白面粉就是把营养部分去掉之后的小麦。",
 w:"一粒小麦有外层的皮和里面一颗小小的胚芽，纤维和大部分维生素都在这两部分里。白面粉只剩中间那块淀粉。因为损失太多，许多国家要求厂家事后再添加回几种维生素。标签上写的强化就是这个意思。",
 a:["换一样就行，不用改整个饮食。全麦面包或糙米，看你吃得最多的是哪种。",
    "看配料表，不要看正面包装。全麦必须是第一位配料，而不只是出现在名字里。"]},

"ultra-processed":{t:"在一项对照试验中，吃超加工食品的人每天多摄入 500 千卡。",
 w:"提供的热量和营养相同，想吃多少都可以。他们吃得更快、吃得更多，却并没有觉得更饱。",
 a:["吃饭速度是你能控制的部分。需要咀嚼的食物本身就会让你慢下来。"]},

"tea-and-iron":{t:"随餐喝茶，可能让你从这餐吸收的铁减半。",
 w:"茶里的单宁会在肠道中与铁结合。这对本身就缺铁的人，以及素食者，影响最大。",
 a:["如果你铁偏低，把茶和咖啡挪到离用餐一小时以外。"]},

"alcohol-units-liver":{t:"肝脏每小时大约清除一个酒精单位，而且这个速度无法加快。",
 w:"咖啡、冷水澡和新鲜空气改变的是你有多清醒，不是血液里有多少酒精。市面上没有任何东西能改变这个速度。",
 a:["数酒精单位，不要数杯数。一大杯葡萄酒是 3 个单位，一品脱高度拉格啤酒 3 个，双份烈酒 2 个。",
    "如果你在午夜喝了 4 个单位，血液要到大约凌晨 4 点才清空，不管你喝了多少咖啡或睡了多久。",
    "每周留出两三天不喝酒，能给肝脏一段它平时得不到的时间。"]},

"sugar-in-drinks":{t:"液体形式的糖不会被身体当成食物记账。",
 w:"饮料很快通过胃，带来的饱腹感远不如同样的糖吃下去，所以这些热量是叠加上去的，而不是替代掉别的。",
 a:["把每天一瓶含糖饮料换成水或无糖版本，是大多数人最容易做到的最大一笔削减。"]},

"cooking-oil-smoke-point":{t:"油一冒烟，就已经开始分解了。",
 w:"过了这个点，它会产生刺激性物质和异味。特级初榨橄榄油约在 190 度冒烟，精炼油更高。",
 a:["如果下锅前油就冒烟了，把锅端离火重新来，不要将就着继续。"]},

"microwave-nutrients":{t:"微波加热比水煮保留更多营养。",
 w:"维生素会因受热和遇水而流失。微波用到的这两样都更少，所以水煮西兰花损失的维生素 C 比微波的多。",
 a:["用一汤匙水加盖，微波或蒸蔬菜。用锅水煮会把维生素漏进你要倒掉的水里。",
    "如果确实要煮，就把煮菜的水用来做汤或调味汁，维生素都在里面。"]},

"frozen-vegetables":{t:"冷冻蔬菜的营养常常胜过新鲜的。",
 w:"它们在采摘后几小时内就被冷冻，而新鲜蔬果可能在运输和储存中待上一周，一路都在流失维生素 C。",
 a:["2 天内吃不完的，就买冷冻的。它往往比在冰箱里放了一周的新鲜货更有营养。",
    "豌豆、菠菜、浆果和西兰花，是冷冻胜过新鲜最明显的几样。"]},

"food-poisoning-danger-zone":{t:"细菌在 5 到 60 度之间繁殖最快。",
 w:"在这个区间里，一个细菌几小时内就能变成几百万个。做好的饭菜放在外面，是最典型的途径。",
 a:["在外面放两小时是实际的上限，天热时是一小时。",
    "剩菜要用浅盘而不是深锅快速降温，然后冷藏。"]},

"rice-bacillus":{t:"米饭放在外面之后，再加热也救不回来。",
 w:"芽孢在烹煮后仍然存活，并在室温下产生毒素。这种毒素不会被加热破坏，所以加热得再狠也没用。",
 a:["米饭要在一小时内降温并冷藏，一天内吃完。"]},

"honey-infants":{t:"满一周岁之前，不要给宝宝吃蜂蜜。",
 w:"蜂蜜可能带有休眠的肉毒杆菌芽孢。成人的肠道很容易把它们压制住，而婴儿的肠道还没有建立起能做到这件事的菌群，一旦发病很严重。",
 a:["满一周岁前完全不要给蜂蜜，包括烘焙食品里、麦片里，以及抹在安抚奶嘴上。",
    "满 1 岁之后就可以了，那时肠道已经有能对付这些芽孢的细菌。"]},

"chicken-washing":{t:"冲洗生鸡肉会把细菌散播到整个厨房。",
 w:"水滴能把弯曲杆菌带到半米外的台面和衣服上。而肉上的细菌，烹熟本来就会杀死。",
 a:["不要冲洗。需要的话用厨房纸吸干，然后把纸扔掉。"]},

"cutting-board-cross-contamination":{t:"砧板导致的食源性疾病比肉本身更常见。",
 w:"留在台面上的生肉汁会转移到下一样切的东西上，通常是不会加热的沙拉。",
 a:["如果只有一块砧板，就先切沙拉和面包，再切生肉，不要反过来。"]},

"leftovers-cooling":{t:"把热菜放进冰箱，会让周围的东西一起变热。",
 w:"一深锅炖菜即使放在冷藏室里，也可能在危险温度区间里停留好几个小时。",
 a:["先分装到浅容器里。让它快速降温的是表面积。"]},

"exercise-first-hour":{t:"每周的第一个小时运动，回报最大。",
 w:"指南说每周 150 到 300 分钟，但风险下降最大的一段就在最开始。从完全不动到动一点，是你迈出的最大的一步。",
 a:["如果你现在完全不运动，就先定每周三次、每次 15 分钟，而不是一个你会放弃的计划。"]},

"steps-10000-myth":{t:"10,000 步的目标来自 1965 年一款计步器的名字。",
 w:"它在日本以万步计的名字出售。在大型研究中，死亡率的下降在 7,500 到 9,000 步附近趋于平缓，而大部分好处远在这之前就已经拿到。",
 a:["在你现在的步数上加 1,000 步，而不是去追一个别人编出来的数字。",
    "如果你每天不到 5,000 步，走到 7,500 步就能拿到大部分健康收益。超过 9,000 步之后曲线就平了。"]},

"grip-strength":{t:"握力对寿命的预测，比血压还准。",
 w:"在一项 14 万人的研究中，握力每下降 5kg，研究期间死亡的概率就高出 16%。重点不在手上，握力代表的是你还剩多少肌肉。",
 a:["吊在单杠上直到撑不住为止，每周两次。能坚持 30 秒就是不错的开始。",
    "两手各拎重物走 40 米，中途不放下。拎买的东西也算。",
    "不用手撑，从椅子上站起来十次。"]},

"muscle-loss-decades":{t:"过了 30 岁，每十年会流失 3% 到 8% 的肌肉。",
 w:"60 岁以后会加快。力量训练在任何年龄都能重建一部分，包括九十多岁的人，因为肌肉响应的是被使用，而不是年轻。",
 a:["每周两次，任何让肌肉对抗阻力的训练都行。徒手、弹力带或器械都算。",
    "测试方法：不用手撑，能在 30 秒内从椅子上站起来 10 次吗？做不到就从这里开始。"]},

"doms-not-lactic":{t:"训练后第二天的酸痛不是乳酸造成的。",
 w:"乳酸一小时内就从血液中清除了。在 24 到 72 小时达到高峰的酸痛，是肌纤维的细微撕裂以及周围的修复过程。",
 a:["第二天做点轻微活动能减轻酸痛，完全休息通常会让它更难受。"]},

"warm-up-vs-stretch":{t:"运动前拉伸几乎不能防止受伤，热身可以。",
 w:"试验中，肌肉没热就做静态拉伸对受伤率几乎没有影响。把肌肉热起来，并预演接下来要做的动作，才是让它准备好工作的方式。",
 a:["把接下来要做的动作放慢放轻做五分钟，胜过任何拉伸套路。"]},

"resting-heart-rate":{t:"更强健的心脏，用更少的次数完成同样的工作。",
 w:"常见的静息心率是 60 到 100，训练有素的耐力运动员常在 40 多。他们的心脏每跳一次泵出的血更多。",
 a:["连续三个早晨，在起床前躺着测。比平常高出 7 次或更多，往往说明你生病了或睡眠不足。"]},

"vo2-max":{t:"你能利用多少氧气，是对寿命最强的预测指标之一。",
 w:"在一些大型研究中，它比是否吸烟还要强。收益最大的一步是离开最底层，而不是爬到最顶端。",
 a:["每周一次，做到喘得说不出话，累计 20 到 30 分钟。快步上坡也算。",
    "大多数智能手表会估算这个数值。看几个月的趋势，不要看每天的数字。"]},

"sitting-breaks":{t:"每半小时走三分钟，能把餐后血糖的高峰削平。",
 w:"活动中的腿部肌肉会自己把糖从血液里取走，不需要胰岛素参与。站着不动的效果远不如走动。",
 a:["站着或走着打电话。这是办公室一天里最容易做的替换。"]},

"breathing-exhale":{t:"呼气比吸气长，几秒钟内就能让心跳慢下来。",
 w:"一条从脑干通到腹部的神经，会在呼气时给心脏踩刹车，吸气时松开。呼气拉长，刹车的时间就更久。",
 a:["吸气 4 秒，呼气 6 秒，做五次。整个方法就这些。",
    "排队站着也能做，不需要任何 App。"]},

"cold-water-face":{t:"冷水泼在脸上会让心跳变慢，泼在手上则不会。",
 w:"鼻子和眼睛周围的神经会触发一种我们与海豹、海豚共有的反射：心跳变慢，血液流向大脑。",
 a:["用冷水敷脸 30 秒，是快速打断惊恐发作的办法。"]},

"blood-pressure-silent":{t:"高血压在造成损害之前没有任何症状。",
 w:"大约三分之一的高血压患者并不知道自己有。它由两个数字组成：心脏泵血时的压力，以及两次跳动之间的压力。",
 a:["从 40 岁起每年量一次，如果距上次已经超过一年，现在就去量。",
    "用家用血压计：先静坐 5 分钟，手臂与心脏同高，间隔一分钟测两次。"]},

"cholesterol-types":{t:"胆固醇不是一个数字，也不是单纯的坏东西。",
 w:"身体会自己制造它，细胞膜和激素也需要它。关键在于它怎么运输。它乘坐两种载体：一种叫 LDL，会把它卸在动脉壁上；另一种叫 HDL，会把它再运走。",
 a:["要完整的分项，而不是总数：LDL、HDL，以及甘油三酯这种血脂。如果这些字母对你没有意义，就问每一项应该是多少，你的偏到了哪一边。",
    "从 40 岁起去查，如果父母一方在 60 岁前有心脏问题就更早查。只需扎一下手指或抽一管血。"]},

"statins-basics":{t:"他汀类药物的作用，是减慢肝脏自己生产胆固醇。",
 w:"血液里的胆固醇大部分是你自己造的，不是吃进去的，所以单靠饮食改变它的幅度比人们以为的小。",
 a:["最常见的抱怨是肌肉酸痛。在没有人知道谁拿到真药的试验里，服用安慰剂的人报告酸痛的频率同样高。停药之前，先要求换一种他汀试试。"]},

"heart-attack-women":{t:"女性心脏病发作时，常常完全不像电影里演的那样。",
 w:"恶心、气短，或下巴和背部疼痛，比压榨性的胸痛更常见。经典描述主要来自对男性的研究，女性因此往往被更晚确诊。",
 a:["出现无法解释的压榨感、气短，或恶心伴冷汗，就叫救护车。",
    "不要自己开车去，也不要等着看会不会自己过去。"]},

"afib-pulse-check":{t:"脉搏不规律，值得你花 30 秒留意。",
 w:"心房颤动是一种常见的心律异常，会让心跳变得不规律，常常没有症状，并把中风风险提高到大约五倍。一旦发现是可以治疗的。",
 a:["偶尔在手腕上摸 30 秒脉搏。毫无规律的不齐，就是要去说的情况。",
    "大多数智能手表会自动检测这一项。有的话值得打开。"]},

"stroke-timing":{t:"中风时，发病的那一分钟本身就是治疗的一部分。",
 w:"溶栓药物在首发症状出现后 4.5 小时内效果最好，而医生不知道那是什么时候就不能用药。一觉醒来才发现的人，往往因此错过。",
 a:["让他微笑、双臂平举、重复一句话。注意有没有一侧做不到。",
    "叫救护车，并说出中风这个词。这会改变他被送往哪家医院。",
    "记下发病时间，见到急救人员先说这个。",
    "不要给阿司匹林，不要给东西吃，也不要让他躺下观望。"]},

"cpr-rate":{t:"胸外按压的频率是每分钟 100 到 120 次，大约每秒两次。",
 w:"在胸部正中按下 5 到 6 厘米深。没受过训练的施救者大多按得太慢、太浅，而做得不完美也好过不做。",
 a:["先呼救，然后开始按压。对未受训练的施救者来说，人工呼吸是可做可不做的。",
    "两次按压之间让胸廓完全回弹。心脏是在这时重新充盈的。"]},

"defibrillator-access":{t:"除颤器不会对不需要电击的人放电。",
 w:"它会先读取心律，如果电击没有帮助就拒绝放电，所以给人贴上它不会造成伤害。早期使用能让存活率大约翻倍。",
 a:["现在就查清楚最近的一台在哪里，别等到需要的时候。多数国家都有公开的地图。",
    "它会用语音把每一步念给你听，不需要受过训练。"]},

"outdoor-time-myopia":{t:"在户外玩耍的孩子，日后需要戴近视眼镜的可能性更低。",
 w:"明亮的户外光似乎能减慢眼球前后变得过长，而正是这种变长造成看远模糊。试验采用的是每天约两小时。",
 a:["日光比限制屏幕更重要。有试验证据支持的是户外时间这一项。"]},

"enamel-no-repair":{t:"吃过酸性的东西后，千万不要马上刷牙。",
 w:"酸会让牙面软化约 30 分钟。牙釉质里没有活细胞，所以被刷掉的部分永远不会长回来。",
 a:["先用清水漱口，等 30 分钟再刷。",
    "小口慢喝比一口喝完伤害更大。一罐饮料喝一小时，牙齿就软上一小时。",
    "含氟量 1350ppm 或更高，管子上会印。刷完吐掉就行，不要漱口。"]},

"gum-disease-heart":{t:"牙周病总是和心脏病一起出现。",
 w:"牙龈肿胀处的细菌会进入血液，动脉壁上也出现同样类型的炎症。两者是否互为因果，目前仍无定论。",
 a:["刷牙出血不是正常现象。这就是该采取行动的信号。"]},

"flossing-evidence":{t:"用牙线防蛀牙的证据薄弱，护牙龈的证据还不错。",
 w:"试验规模小、时间短，所以隔一阵就有标题宣称它没用。清洁牙缝确实能减少牙龈红肿疼痛。",
 a:["牙缝大到能塞进牙间刷的地方，牙间刷比牙线好。",
    "目标是每天一次。每天马虎地做，胜过每周日做得完美。"]},

"mouthwash-timing":{t:"刷完牙马上用漱口水，会把氟冲掉。",
 w:"牙膏会在牙齿上留下一层氟。用任何东西漱口，包括清水，都会把大部分冲走。",
 a:["把漱口水放在和刷牙不同的时间用，或者干脆不用。"]},

"toothbrush-pressure":{t:"刷得更用力，磨掉的是牙龈，不是牙菌斑。",
 w:"牙菌斑很软，轻轻接触就能刷掉。用力和硬毛会导致牙龈退缩和牙颈部敏感。",
 a:["用指尖捏住牙刷，不要整只手攥着。软毛，2 分钟，画小圈。"]},

"sunscreen-spf-numbers":{t:"SPF 30 挡住 97%，SPF 50 挡住 98%。",
 w:"两个数字之间的差距很小。标签和你实际得到的防护之间差距却不小，因为大多数人涂的量只有测试用量的四分之一到一半。",
 a:["脸和脖子一茶匙，全身一小杯烈酒杯的量。大多数人用得远远不够。",
    "在户外每两小时补涂一次。防水的意思是游泳 40 分钟，不是一整天。"]},

"uva-through-glass":{t:"有一种阳光会直接穿过你的窗户。",
 w:"造成晒伤的波段大多被玻璃挡住，造成老化的那种则能穿过。所以在一些国家，司机靠窗一侧的脸会有更多日晒损伤。",
 a:["如果你每天开车，在靠窗一侧的脸和手臂涂防晒。多数车窗玻璃挡住晒伤的射线，却放过致老化的射线。",
    "办公桌靠窗？道理一样。UVA 会整天透过玻璃照到你。"]},

"mole-abcde":{t:"对于痣来说，最重要的信号是变化。",
 w:"清单是：不对称、边缘不规则、颜色不均、直径超过 6mm，以及正在变化。最后一项分量最重。",
 a:["把拿不准的痣和尺子一起拍下来，一个月后对比。",
    "发痒、出血，或者和你身上其他痣都不一样的痣，值得给人看看。"]},

"sunglasses-uv":{t:"不防紫外线的深色墨镜，比不戴还糟。",
 w:"镜片深色会让瞳孔张得更大。如果镜片不挡紫外线，进入眼睛内部的紫外线比你在强光下眯眼时还多。",
 a:["认准 UV400 或 100% UV 的标识。价格和颜色深浅说明不了任何问题。"]},

"vitamin-d-vs-burn":{t:"远在晒伤之前，你当天的维生素 D 就已经合成够了。",
 w:"夏天露出手臂晒一小会儿，对大多数肤色就够了。一直晒到发红只会增加损伤，不会增加维生素 D，因为合成量会到达平台。",
 a:["夏天在正午前后，露出前臂和面部晒 10 到 20 分钟，就是一天的量。然后就遮起来或去阴凉处。",
    "肤色深的需要更久，肤色浅的更短。不管什么肤色，都不要让皮肤晒到发红。"]},

"dandruff-fungus":{t:"头皮屑通常是一种酵母菌造成的，不是干燥。",
 w:"一种人人皮肤上都有的酵母菌，在某些人身上过度繁殖并刺激头皮。所以保湿洗发水没用，而抗真菌洗发水有效。",
 a:["找含酮康唑、二硫化硒或吡硫翁锌的产品，在头上停留 5 分钟再冲掉。"]},

"acne-not-chocolate":{t:"巧克力和油腻食物不会让你长痘。",
 w:"痤疮是油脂、死细胞和细菌堵住毛囊，主要由激素驱动。饮食的影响很小，主要与高糖负荷有关，也可能与脱脂牛奶有关。",
 a:["用力搓洗只会让皮肤更发炎，情况更糟。",
    "用非处方产品治疗 3 个月仍不见好，就该去开处方，而不是再买更多产品。"]},

"eczema-barrier":{t:"湿疹是皮肤屏障在漏水，不只是痒。",
 w:"皮肤流失水分，又让刺激物进来，于是引发红和痒。所以保湿剂是治疗手段，而不只是让人舒服。",
 a:["洗完澡 3 分钟内，在皮肤还湿润时涂保湿剂。",
    "每天都用，包括皮肤看起来正常的时候。这才是防止复发的关键。"]},

"hand-cream-timing":{t:"保湿霜靠锁住水分起作用，所以要先把皮肤弄湿。",
 w:"它主要做的是减慢蒸发。皮肤干透了，能锁住的水就少得多。",
 a:["洗完手 3 分钟内趁还湿润时涂上。这样是把水封住，而不是搁在干皮肤上。",
    "在你常用的每个水池边放一支。只有护手霜和水在一起，这个时机才成立。"]},

"antibiotics-viruses":{t:"抗生素对感冒毫无作用，因为感冒是病毒引起的。",
 w:"抗生素攻击的是只有细菌才有的结构，比如细胞壁。病毒一样都没有。照吃不误，只会让你承受副作用，并帮助耐药菌扩散。",
 a:["遇到感冒、咽痛或咳嗽，问医生一个问题：这很可能是病毒引起的吗？如果是，抗生素帮不上忙。",
    "感冒持续 7 到 10 天，咳嗽可能持续 3 周。超过之后还不见好，才是该再去看医生的时候。"]},

"antibiotic-course-length":{t:"把疗程吃完这条建议正在被重新审视，但不该由你在家里来决定。",
 w:"对某些感染，较短的疗程现在效果一样好，而且建议因病而异。没有变的是：疗程长短应该由开药的医生决定，而不是由你第三天感觉如何来决定。",
 a:["拿药时就问清楚该吃多久、为什么。这是个合理的问题。"]},

"paracetamol-limit":{t:"对乙酰氨基酚的常规剂量与损伤肝脏的剂量之间，间隔很窄。",
 w:"成人上限约为每天 4g，超出不多就可能开始造成损害。它还藏在感冒冲剂和复方止痛药里。",
 a:["再加一剂之前，先检查药柜里其他每一种药是否含对乙酰氨基酚。",
    "过量在第一天几乎没有症状，而早期是可以治疗的。绝对不要等着观察。"]},

"ibuprofen-stomach":{t:"布洛芬会阻断保护胃黏膜的那种化学物质。",
 w:"它减轻疼痛和肿胀靠的是同一个作用，而这会减慢胃黏膜的持续重建，所以长期服用会导致溃疡和出血。",
 a:["随餐服用，用能起效的最低剂量，没有医嘱不要连续吃超过几天。",
    "如果你有肾病、心力衰竭，或处于脱水状态，就完全不要用。"]},

"grapefruit-interaction":{t:"西柚能让一片药起到三片的效果。",
 w:"它会阻断肠道里的一种物质，那种物质本来会在药物进入血液前销毁其中一部分，而这种阻断能持续一天以上。有几十种药受影响，包括一些他汀和降压药。",
 a:["错开时间没有用。如果说明书提到西柚，就完全不要吃。"]},

"expiry-dates-medicines":{t:"大多数药片过期后是药效下降，而不是变得危险。",
 w:"对陈年库存的检测发现，许多药在多年后仍然完全有效。但例外很重要：液体抗生素、胰岛素、心绞痛喷雾，以及任何存放在高温或潮湿处的药。",
 a:["急救类药物绝不要拿过期的碰运气，比如吸入器或肾上腺素笔。"]},

"nocebo-effect":{t:"读了副作用清单，你更容易出现这些副作用。",
 w:"在没有人知道谁拿到真药的试验里，服用安慰剂的人依然报告了相当一部分列出的副作用。这是真实的体验，不是想象。",
 a:["在停掉一种确实有效的药之前，值得知道这一点。问问再试一次是否合理。"]},

"vaccine-soreness":{t:"打完疫苗手臂酸痛，是免疫反应正在建立。",
 w:"免疫细胞聚集到注射部位，造成酸痛和疲倦。这不是疾病的轻症版本，而没有反应也不代表疫苗没起作用。",
 a:["多活动手臂。用它能促进血液流动，缩短酸痛时间。",
    "不要为了预防酸痛在打针前吃止痛药。打完之后如果需要，是可以的。"]},

"flu-vaccine-timing":{t:"流感疫苗的保护在接种后约两周达到高峰，然后在几个月里减弱。",
 w:"所以接种时间是一种折中：既要覆盖整个流行季，又要在季末仍然有效。",
 a:["在北半球，秋天通常是最合适的时候。晚打也比不打好。"]},

"handwashing-soap":{t:"肥皂不是毒死病菌，而是把它们的外衣撕开。",
 w:"许多病毒外面裹着一层脂质包膜。肥皂分子一端抓脂肪，另一端抓水，于是包膜被撬开并冲走。这需要接触时间，20 秒就是这么来的。",
 a:["用肥皂洗 20 秒。头几次数一数，它比大多数人以为的要长。",
    "最重要的几个时刻：吃饭前、上完厕所后，以及坐完公共交通回到家时。"]},

"cold-air-nose":{t:"冷空气不会让你感冒，但确实会削弱你的鼻子。",
 w:"2022 年的一项研究发现，鼻腔内部温度下降约 5 度，它对病毒的防御能力就削减了近一半。但病毒仍然得先到达才行。",
 a:["天冷时把围巾或口罩拉上盖住鼻子。这能让鼻黏膜保持足够温暖以继续工作。",
    "在户外用鼻子而不是嘴呼吸。鼻子会在空气到达喉咙之前把它加温。"]},

"sneeze-distance":{t:"一个喷嚏能在不到一秒内把飞沫喷出好几米。",
 w:"高速摄影显示，这团云雾传播的距离远超旧的一米建议所假定的范围。",
 a:["打进手肘里，不要打在手上，也不要对着空气打。"]},

"humidity-and-viruses":{t:"干燥的室内空气从两个方面帮了呼吸道病毒。",
 w:"飞沫会缩小并在空气中停留更久，而气道表面的黏液在干燥时也工作得更差。冬季供暖是常见的原因。",
 a:["冬天室内湿度争取保持在 40% 到 60%。一个 10 美元的湿度计就能告诉你现在是多少。",
    "没有加湿器？在暖气片上放一盆水，或者把衣服晾在室内，都能改变这个数字。"]},

"loneliness-risk":{t:"社会联系薄弱带来的死亡风险，和主要的身体健康风险处在同一量级。",
 w:"在涵盖超过 300,000 人的多项研究中，亲密关系很少的人在研究期间死亡的可能性高出 26% 到 32%。年龄和起始健康状况都已纳入考虑。",
 a:["规律胜过强度。一个每周固定的约定，比偶尔的大动作更有用。",
    "和人一起做一件事，往往比约着见面聊天更有效。"]},

"nature-120-minutes":{t:"每周在绿地待两小时，与更好的身心状态相关。",
 w:"在一项近 20,000 人的研究中，每周 120 分钟起就能看到身心状态改善。一次长时间去，还是分几次短时间去，没有差别。",
 a:["每周在绿地待两小时。不必一次凑齐：在公园走三次、每次 40 分钟也算。",
    "像约会一样把它排进日程。研究中达到这个时长的人，不是靠随缘的。"]},

"exercise-and-mood":{t:"对轻中度抑郁，运动的效果与抗抑郁药不相上下。",
 w:"试验发现两者的获益幅度相近，不过运动研究更难做到公平，退出的人也更多。它最好是加在治疗之上，而不是取代治疗。",
 a:["任何让你呼吸加快的活动都算。在试验中，集体活动或户外活动表现略好一些。"]},

"breathing-anxiety":{t:"缓慢呼吸让你平静，靠的是神经，不是想法。",
 w:"长长地呼气会启动给心脏踩刹车的那套系统，所以即使担忧还在，惊恐中身体的那部分也会平息下来。",
 a:["吸气 4 秒，呼气 6 秒，做两分钟。起作用的是更长的那口呼气。"]},

"rumination-vs-reflection":{t:"反复琢磨一个问题，只有在问题本身换了的时候才有用。",
 w:"问为什么这事偏偏发生在我身上，往往会陷入循环；问我接下来要做什么，往往能了结。研究中把这种区别称为反刍与反思。",
 a:["如果同一句话你已经想了两遍，就写下一个下一步行动，而不是想第三遍。"]},

"hearing-loss-and-dementia":{t:"未经处理的听力下降，是可改变的痴呆风险中最大的几项之一。",
 w:"这种关联在大型研究中一致出现，2023 年的一项试验发现，助听器减慢了本已高风险人群在记忆和思维上的衰退。因果关系尚未完全确定。",
 a:["在餐厅里听着吃力是早期信号，远早于安静环境下的对话变难。",
    "免费的听力检查很普遍。人们平均要拖大约 10 年才去处理。"]},

"smoking-quit-timeline":{t:"抽完最后一根烟 20 分钟后，身体就开始修复。",
 w:"心率和血压几乎立刻下降。一年后，心脏病的额外风险大约减半；15 年后，已接近从未吸烟的人。",
 a:["尼古丁贴片搭配口香糖或含片一起用，戒烟成功率大约是单靠意志力的两倍。",
    "在 2 周内定下戒烟日，并告诉一个人。多数国家都有免费的戒烟热线，能进一步提高成功率。"]},

"vaping-unknowns":{t:"电子烟明显比吸烟危害小，但并未被证实是安全的。",
 w:"它避开了焦油和大部分燃烧产物，也确实帮一些人戒了烟。长期影响未知，因为它存在的时间还不够长，测不出来。",
 a:["如果你不吸烟，就不要开始用电子烟。没有任何健康上的理由。",
    "如果你吸烟，完全改用电子烟更安全。然后再定一个日子把电子烟也停掉，而不是把它当成终点。"]},

"alcohol-and-cancer-risk":{t:"酒精致癌。这方面证据的确定程度，和烟草、石棉一样高。",

const L=()=>TR[state.lang]||TR.en;

/* Display text for a fact in the current language, falling back per field.
   A step list of a different length falls back whole, so the numbering can
   never disagree with the English. */
function txt(f){
  const tr=(L().facts||{})[f.id];
  if(!tr) return f;
  const a=(tr.a && f.a && tr.a.length===f.a.length)?tr.a:f.a;
  return {id:f.id,cat:f.cat,art:f.art,sub:f.sub,c:f.c,t:tr.t||f.t,w:tr.w||f.w,a:a};
}
const dayKey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

async function loadState(){
  const raw=await store.get();
  if(raw){ try{ Object.assign(state, JSON.parse(raw)); }catch(e){} }
  for(const k of ["saved","seen"]) if(!Array.isArray(state[k])) state[k]=[];
  if(typeof state.assigned!=="object"||!state.assigned) state.assigned={};
  if(!state.cycle) state.cycle=1;
  if(LANGS.indexOf(state.lang)<0) state.lang="en";
  /* drop saves and assignments pointing at facts that no longer exist */
  state.saved=state.saved.filter(id=>BY_ID[id]);
  state.seen=state.seen.filter(id=>BY_ID[id]);
  for(const d of Object.keys(state.assigned)) if(!BY_ID[state.assigned[d]]) delete state.assigned[d];
}
const persist=()=>store.set(JSON.stringify(state));

/* Today's fact is chosen once and written down. Adding facts later cannot move it. */
function factForToday(){
  const k=dayKey(new Date());
  if(state.assigned[k]) return BY_ID[state.assigned[k]];

  let pool=ORDER.filter(f=>!state.seen.includes(f.id));
  if(!pool.length){ state.cycle++; state.seen=[]; pool=ORDER.slice(); }   /* pool exhausted: start a review pass */

  /* not the same category as yesterday, when there is any other choice */
  const y=new Date(); y.setDate(y.getDate()-1);
  const prev=BY_ID[state.assigned[dayKey(y)]];
  if(prev){ const other=pool.filter(f=>f.cat!==prev.cat); if(other.length) pool=other; }

  /* rotate the starting point each cycle so a second pass is not the same order */
  const pick=pool[ hash("cycle"+state.cycle) % pool.length ];
  state.assigned[k]=pick.id;
  state.seen.push(pick.id);

  const keep=Object.keys(state.assigned).sort().slice(-120);   /* keep four months of history */
  const trimmed={}; keep.forEach(d=>trimmed[d]=state.assigned[d]);
  state.assigned=trimmed;
  persist();
  return pick;
}

function updateStreak(){
  const now=new Date(), k=dayKey(now);
  if(state.lastOpen===k) return;
  const y=new Date(now); y.setDate(y.getDate()-1);
  state.streak=(state.lastOpen===dayKey(y))?(state.streak||0)+1:1;
  state.lastOpen=k; persist();
}

/* Explanatory doodle where one exists, otherwise the subject's character. */
function artFor(f){
  if(f.art && ART[f.art])
    return '<figure class="doodle">'+ART[f.art].svg+'<figcaption>'+ART[f.art].cap+'</figcaption></figure>';
  const char=MASCOT_FOR[f.sub]||"body";
  const sp=SCENES[f.id];
  if(sp){
    const svg=scene(sp,CATS[f.cat].color,char);
    if(svg) return '<figure class="doodle">'+svg+'</figure>';
  }
  return "";   /* no honest picture for this fact: show none rather than a generic shape */
}

function rr(x,px,py,w,h,r,fill){ x.beginPath(); x.roundRect(px,py,w,h,r); x.fillStyle=fill; x.fill(); }
/* Greedy wrap that breaks on spaces for English and between characters for
   Chinese, which has none. */
const CJK=/[\u2E80-\u9FFF\uF900-\uFAFF\uFF00-\uFF60\u3000-\u303F]/;
function wrapCanvas(x,text,maxW){
  const lines=[]; let cur="";
  for(let i=0;i<text.length;i++){
    const ch=text[i], test=cur+ch;
    if(cur && x.measureText(test).width>maxW){
      if(ch===" "){ lines.push(cur); cur=""; continue; }
      if(CJK.test(ch)||CJK.test(cur[cur.length-1])){ lines.push(cur); cur=ch; continue; }
      const sp=cur.lastIndexOf(" ");
      if(sp>0){ lines.push(cur.slice(0,sp)); cur=cur.slice(sp+1)+ch; }
      else { lines.push(cur); cur=ch; }
    } else cur=test;
  }
  if(cur.trim()) lines.push(cur.trim());
  return lines;
}
function svgToImage(svgEl){
  return new Promise(res=>{
    if(!svgEl) return res(null);
    const clone=svgEl.cloneNode(true);
    const vb=(clone.getAttribute("viewBox")||"0 0 320 150").split(/\s+/).map(Number);
    clone.setAttribute("width",vb[2]*3); clone.setAttribute("height",vb[3]*3);
    clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
    const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone)],{type:"image/svg+xml"}));
    const img=new Image();
    img.onload=()=>{ URL.revokeObjectURL(url); res({img,w:vb[2],h:vb[3]}); };
    img.onerror=()=>{ URL.revokeObjectURL(url); res(null); };
    img.src=url;
  });
}

/* The card carries the whole fact: headline, picture, why, and the steps.
   Height is measured first and the canvas sized to fit, so nothing is cut off.
   Buttons and the streak are page furniture and stay off it. */
async function buildShareCard(f0){
  const f=txt(f0);
  const W=1080, pad=72, ix=pad+52, iw=W-pad*2-104, x0=L();
  if(document.fonts&&document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }

  const m=document.createElement("canvas").getContext("2d");
  m.font="500 66px "+FD;            const titleLines=wrapCanvas(m,f.t,iw);
  m.font="400 37px "+NU;            const whyLines=wrapCanvas(m,f.w,iw);
  m.font="400 35px "+NU;
  const steps=(f.a||[]).map(t=>wrapCanvas(m,t,iw-72));
  const art=await svgToImage(document.querySelector("#art svg"));

  const TL=82, WL=52, SL=48;
  let artH=0, artW=0;
  if(art){ const sc=Math.min((iw-60)/art.w,520/art.h); artW=art.w*sc; artH=art.h*sc; }

  let y=110+120+54;                       /* card top, header bar, gap */
  const yChip=y;            y+=56+38;
  const yTitle=y;           y+=titleLines.length*TL+(art?30:34);
  const yArt=y;             if(art) y+=artH+40+34;
  const yWhyLbl=y;          y+=34+16;
  const yWhy=y;             y+=whyLines.length*WL;
  let yDoLbl=0, yStep=0;
  if(steps.length){ y+=34; yDoLbl=y; y+=34+18; yStep=y;
    steps.forEach(ls=>{ y+=ls.length*SL+22; }); }
  y+=36;
  const yFoot=y;            y+=34+52;
  const H=Math.round(y+110);

  const c=document.createElement("canvas"); c.width=W; c.height=H;
  const x=c.getContext("2d");
  x.fillStyle="#16213A"; x.fillRect(0,0,W,H);
  rr(x,pad,110,W-pad*2,H-220,44,"#F0EDE6");
  x.save(); x.beginPath(); x.roundRect(pad,110,W-pad*2,120,[44,44,0,0]); x.fillStyle="#2E4269"; x.fill(); x.restore();

  x.textBaseline="middle";
  x.fillStyle="#F3F0EA"; x.font="500 46px "+FD; x.fillText("Vitals",ix,170);
  const now=new Date();
  x.textAlign="right"; x.fillStyle="#A3B4CC"; x.font="600 30px "+NU;
  x.fillText(x0.cardDate(now.getDate(),now.getMonth(),now.getFullYear()),W-pad-52,170);
  x.textAlign="left";

  const cat=CATS[f.cat], label=catLabel(f.cat);
  x.font="600 30px "+FD;
  const cw=x.measureText(label).width+64;
  rr(x,ix,yChip,cw,56,28,tint(cat.color,.12));
  x.fillStyle=cat.color; x.fillText(label,ix+38,yChip+28);
  x.beginPath(); x.arc(ix+22,yChip+28,6,0,7); x.fill();

  x.textBaseline="top";
  x.fillStyle="#22355C"; x.font="500 66px "+FD;
  titleLines.forEach((ln,i)=>x.fillText(ln,ix,yTitle+i*TL));

  if(art){
    rr(x,ix,yArt,iw,artH+40,36,"#FAF8F3");
    x.drawImage(art.img,ix+(iw-artW)/2,yArt+20,artW,artH);
  }

  x.fillStyle="#C64A31"; x.font="600 26px "+FD;
  x.fillText(x0.why.toUpperCase(),ix,yWhyLbl);
  x.fillStyle="#3C5B86"; x.font="400 37px "+NU;
  whyLines.forEach((ln,i)=>x.fillText(ln,ix,yWhy+i*WL));

  if(steps.length){
    x.fillStyle="#C64A31"; x.font="600 26px "+FD;
    x.fillText(x0.doThis.toUpperCase(),ix,yDoLbl);
    let sy=yStep;
    steps.forEach((ls,n)=>{
      x.fillStyle=tint(cat.color,.14); x.beginPath(); x.arc(ix+17,sy+18,17,0,7); x.fill();
      x.fillStyle=cat.color; x.font="600 24px "+FD; x.textAlign="center";
      x.fillText(String(n+1),ix+17,sy+7); x.textAlign="left";
      x.fillStyle="#232833"; x.font="400 35px "+NU;
      ls.forEach((ln,i)=>x.fillText(ln,ix+56,sy+i*SL));
      sy+=ls.length*SL+22;
    });
  }

  x.fillStyle="#7788A3"; x.font="600 28px "+NU;
  x.fillText(x0.tagline,ix,yFoot);
  x.fillStyle="#C64A31"; x.font="600 30px "+FD;
  x.fillText(SHARE_URL.replace(/^https?:\/\//,"").replace(/\/$/,""),ix,yFoot+42);
  return new Promise(res=>c.toBlob(res,"image/png"));
}
async function prepareShare(){
  const f=viewing; if(!f) return;
  shareFor=f.id; shareBlob=null;
  try{ const b=await buildShareCard(f); if(shareFor===f.id) shareBlob=b; }catch(e){ shareBlob=null; }
}
async function shareNow(){
  const f=viewing, btn=el("share"), lab=el("shareLabel");
  btn.disabled=true; lab.textContent=L().preparing;
  try{
    let blob=(shareFor===f.id&&shareBlob)?shareBlob:await buildShareCard(f);
    const file=new File([blob],"vitals-"+f.id+".png",{type:"image/png"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:"Vitals",text:f.t});
    }else if(navigator.share){
      await navigator.share({title:"Vitals",text:f.t,url:SHARE_URL});
    }else{
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=file.name; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    }
  }catch(e){ /* user closed the share sheet, or not supported */ }
  btn.disabled=false; lab.textContent=L().share;
}
el("share").onclick=shareNow;

}
el("langBtn").onclick=()=>{
  state.lang = state.lang==="zh" ? "en" : "zh";
  persist();
  shareFor=null; shareBlob=null;   /* card text is language specific, build it again */
  render();
};

function renderSheet(){
  const b=el("sheetBody");
  if(!state.saved.length){ b.innerHTML='<p class="empty">'+L().nothingSaved+'</p>'; return; }
  const groups={};
  state.saved.forEach(id=>{ const f=BY_ID[id]; if(f) (groups[f.cat]=groups[f.cat]||[]).push(f); });
  const keys=Object.keys(CATS).filter(k=>groups[k]);
  b.innerHTML=keys.map(k=>{
    const c=CATS[k].color;
    return '<div class="grp">'+
      '<span class="ghead" style="color:'+c+';background:'+tint(c,.10)+'">'+
        '<s style="background:'+c+'"></s>'+catLabel(k)+'<b>'+groups[k].length+'</b></span>'+
      '<ul style="border-color:'+tint(c,.28)+'">'+
        groups[k].map(f=>'<li><button type="button" data-id="'+f.id+'">'+txt(f).t+'</button></li>').join("")+
      '</ul></div>';
  }).join("");
}
el("sheetBody").addEventListener("click",e=>{
  const btn=e.target.closest("button[data-id]"); if(!btn) return;
  const f=BY_ID[btn.dataset.id]; if(!f) return;
  el("sheet").hidden=true;
  show(f, todayFact && f.id===todayFact.id);
});
el("backToday").onclick=()=>show(todayFact,true);

function show(f,today){
  const p=el("page"); p.classList.add("tearing");
  setTimeout(()=>{ p.classList.remove("tearing"); viewing=f; isToday=!!today; render(); window.scrollTo({top:0}); },450);
}

el("openBtn").onclick=()=>{
  const o=el("panel").classList.toggle("open");
  el("openBtn").setAttribute("aria-expanded",o?"true":"false");
};
el("save").onclick=()=>{
  const id=viewing.id, i=state.saved.indexOf(id);
  if(i>=0) state.saved.splice(i,1); else state.saved.push(id);
  persist(); render();
};
el("savedPill").onclick=()=>{ el("sheet").hidden=!el("sheet").hidden; };

(async()=>{
  await loadState();
  updateStreak();
  todayFact=factForToday();
  viewing=todayFact; isToday=true;
  render();
})();



</script>
