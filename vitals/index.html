<style>
:root{
  --kon:#22355C;
  --ai:#3C5B86;
  --ai-soft:#7788A3;
  --shu:#C64A31;
  --shu-tint:rgba(198,74,49,.08);
  --shu-tint-2:rgba(198,74,49,.16);
  --mint:#7FC0AC;
  --sand:#EFC98A;
  --paper:#F0EDE6;
  --paper-2:#FAF8F3;
  --line:#D8D3C7;
  --sumi:#232833;
  --wall:#16213A;
  --disp:"Fredoka",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --sans:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;padding:18px 13px 34px;
  font-family:var(--sans);color:var(--sumi);
  background:radial-gradient(130% 90% at 50% -10%,#22335A 0%,var(--wall) 55%,#101A2E 100%);
  display:flex;flex-direction:column;align-items:center;gap:12px;
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
}
.wrap{width:100%;max-width:412px}
.mock{width:100%;max-width:412px;display:flex;align-items:center;gap:8px;color:#8FA1BD;font-size:11.5px;padding:0 2px 2px}
.mock i{flex:1;height:1px;background:rgba(255,255,255,.10)}

.board{background:linear-gradient(#2E4269,#26375A);border-radius:20px 20px 5px 5px;padding:13px 18px;
  display:flex;align-items:center;justify-content:space-between;box-shadow:0 12px 30px rgba(0,0,0,.40)}
.brand{display:flex;align-items:center;gap:9px;color:#F3F0EA;font-size:18px;font-weight:500;font-family:var(--disp)}
.period{color:#A3B4CC;font-size:12.5px}

.stack{position:relative}
.stack::before,.stack::after{content:'';position:absolute;left:7px;right:7px;top:3px;bottom:-5px;
  background:#E2DED4;border-radius:0 0 4px 4px;z-index:0}
.stack::after{left:13px;right:13px;top:7px;bottom:-10px;background:#D4CFC3}
.page{position:relative;z-index:1;background:var(--paper);padding:16px 20px 22px;border-radius:0 0 4px 4px;transform-origin:50% 0}
.page::after{content:'';position:absolute;left:0;right:0;bottom:-8px;height:9px;background:var(--paper);
  -webkit-mask-image:radial-gradient(circle at 6px 0,transparent 5.4px,#000 6px);
  mask-image:radial-gradient(circle at 6px 0,transparent 5.4px,#000 6px);
  -webkit-mask-size:12px 9px;mask-size:12px 9px}

.head{display:flex;align-items:flex-start;justify-content:space-between}
.date{display:flex;align-items:baseline;gap:10px}
.num{font-family:var(--disp);font-size:64px;font-weight:600;letter-spacing:-.02em;line-height:.9;color:var(--kon)}
.num.sun{color:var(--shu)}
.dow{font-size:13.5px;font-weight:600;color:var(--ai-soft)}
.bm{width:40px;height:40px;border-radius:14px;border:1.5px solid var(--line);background:transparent;
  display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.bm svg{width:17px;height:17px;fill:none;stroke:var(--ai);stroke-width:1.9;stroke-linejoin:round}
.bm.on{background:var(--shu);border-color:var(--shu)}
.bm.on svg{fill:#fff;stroke:#fff}

.chip{display:inline-flex;align-items:center;gap:6px;margin:14px 0 12px;padding:6px 13px;border-radius:999px;
  background:var(--shu-tint);color:var(--shu);font-size:12.5px;font-weight:600;font-family:var(--disp)}
.chip s{width:5px;height:5px;border-radius:50%;background:var(--shu);text-decoration:none}

.fact{font-family:var(--disp);font-size:24px;line-height:1.32;font-weight:500;letter-spacing:-.01em;margin:0;color:var(--kon)}

.doodle{margin:18px 0 4px;background:var(--paper-2);border:1.5px dashed rgba(34,53,92,.18);border-radius:22px;padding:10px 10px 8px}
.doodle svg{width:100%;height:auto;display:block}
.doodle.mascot{padding:6px 10px 4px;background:transparent;border-style:dotted;border-color:rgba(34,53,92,.13)}
.doodle figcaption{font-size:12px;color:var(--ai-soft);line-height:1.45;margin:6px 8px 2px;text-align:center}

.open-btn{position:relative;width:100%;margin-top:20px;border:0;cursor:pointer;font-family:var(--disp);
  background:var(--shu);color:#fff;border-radius:20px;padding:15px 52px;
  display:flex;align-items:center;justify-content:center;text-align:center;font-size:17px;font-weight:500;
  box-shadow:0 6px 16px rgba(198,74,49,.26)}
.open-btn:active{transform:translateY(1px)}
.open-btn .ic{position:absolute;right:15px;top:50%;width:27px;height:27px;border-radius:50%;
  background:rgba(255,255,255,.22);display:grid;place-items:center;
  transform:translateY(-50%);transition:transform .25s ease}
.open-btn .ic svg{width:12px;height:12px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round}
.open-btn[aria-expanded="true"]{border-radius:20px 20px 0 0;box-shadow:none}
.open-btn[aria-expanded="true"] .ic{transform:translateY(-50%) rotate(180deg)}

.panel{overflow:hidden;max-height:0;transition:max-height .32s cubic-bezier(.3,0,.2,1)}
.panel.open{max-height:800px}
.panel-in{background:var(--shu-tint);border-radius:0 0 20px 20px;padding:16px 17px 18px}
.lbl{font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--shu)}
.why{font-size:15px;line-height:1.55;color:#3E4653;margin:8px 0 0}
.do{margin-top:16px;padding-top:14px;border-top:1.5px dashed var(--shu-tint-2)}
.do ul{list-style:none;margin:9px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.do li{display:flex;gap:10px;font-size:15px;line-height:1.5;color:#3E4653}
.do li b{flex:0 0 auto;width:21px;height:21px;border-radius:50%;background:var(--shu);color:#fff;
  font-family:var(--disp);font-size:12px;font-weight:500;display:grid;place-items:center;margin-top:1px}

.save{width:100%;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:9px;padding:15px 12px;
  border-radius:20px;border:2px solid var(--shu);background:transparent;color:var(--shu);
  font-family:var(--disp);font-size:16.5px;cursor:pointer}
.save svg{width:18px;height:18px;fill:none;stroke:var(--shu);stroke-width:2;stroke-linejoin:round}
.save.on{background:var(--shu);color:#fff}
.save.on svg{fill:#fff;stroke:#fff}
.save:active{transform:translateY(1px)}
.doodle.mascot{background:transparent;border-style:dotted;border-color:rgba(34,53,92,.14);padding:8px 10px 6px}
.tear{display:none;
  color:var(--kon);font-family:var(--disp);font-size:16px;font-weight:400;cursor:pointer}
.tear:active{background:#E5E1D6}

.bar{width:100%;max-width:412px;display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.10);color:#C9D5E6;font-size:13px;font-family:var(--sans);cursor:pointer}
.pill .badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--shu);color:#fff;
  font-family:var(--disp);font-size:11.5px;display:grid;place-items:center}
.pill.plain{cursor:default}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--mint)}

.sheet{width:100%;max-width:412px;background:var(--paper-2);border-radius:22px;padding:16px 18px}
.sheet h2{font-family:var(--disp);font-size:16px;font-weight:500;margin:0 0 10px;color:var(--kon)}
.sheet .grp+.grp{margin-top:18px}
.sheet .ghead{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;
  background:var(--shu-tint);color:var(--shu);font-family:var(--disp);font-size:12.5px;font-weight:600}
.sheet .ghead s{width:5px;height:5px;border-radius:50%;background:var(--shu);text-decoration:none}
.sheet .ghead b{font-weight:400;opacity:.65;font-size:11.5px}
.sheet ul{list-style:none;margin:10px 0 0;padding:0 0 0 4px;display:flex;flex-direction:column;gap:10px;
  border-left:1.5px dashed var(--shu-tint-2)}
.sheet li{font-size:14.5px;line-height:1.45;padding-left:12px;color:var(--sumi)}
.sheet .empty{font-size:13.5px;color:var(--ai-soft);margin:0}
.fine{width:100%;max-width:412px;color:#63738D;font-size:11.5px;padding:2px 4px}

.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:5;display:flex;align-items:center;gap:4px;
  padding:6px;border-radius:999px;background:rgba(22,33,58,.92);border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(12px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.nav button{width:38px;height:38px;border-radius:999px;border:0;background:rgba(255,255,255,.09);color:#DCE5F2;
  font-family:var(--disp);font-size:17px;cursor:pointer}
.nav span{color:#A3B4CC;font-size:12.5px;min-width:70px;text-align:center;font-family:var(--disp)}

@keyframes tear{0%{transform:rotate(0) translateY(0);opacity:1}
 30%{transform:rotate(2deg) translateY(5px)}100%{transform:rotate(-7deg) translateY(460px);opacity:0}}
.tearing{animation:tear .48s cubic-bezier(.42,.1,.72,1) forwards}
@media (prefers-reduced-motion:reduce){.tearing{animation:none;opacity:0}.panel{transition:none}}
button:focus-visible{outline:2.5px solid var(--shu);outline-offset:3px}
</style>


<div class="wrap">
  <div class="board">
    <span class="brand">
      <svg width="19" height="19" viewBox="0 0 18 18"><rect x="1" y="2.5" width="16" height="13.5" rx="4.5" fill="#F0EDE6"/><rect x="1" y="2.5" width="16" height="4.5" rx="2.2" fill="#8D9DB6"/><path d="M4.2 11.8c2.6-1.6 7.3-2 10-.8-2.8.2-7.2.9-10 .8z" fill="#C64A31"/></svg>
      Vitals
    </span>
    <span class="period" id="period"></span>
  </div>

  <div class="stack">
    <div class="page" id="page">
      <div class="head">
        <div class="date"><span class="num" id="num">3</span><span class="dow" id="dow"></span></div>
      </div>

      <span class="chip" id="chip"><s id="chipDot"></s><span id="chipLabel"></span></span>

      <button class="open-btn" id="openBtn" aria-expanded="false" aria-controls="panel">

        <span class="ic"><svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg></span>

        <span id="saveLabel">Save</span>
      </button>
    </div>
  </div>
</div>

<div class="bar">
  <button class="pill" id="savedPill">Saved<span class="badge" id="savedCount">0</span></button>
  <span class="pill plain"><span class="dot"></span><span id="streak"></span></span>
</div>

<div class="sheet" id="sheet" hidden><h2>Saved</h2><div id="sheetBody"></div></div>

<script>
/* ── doodle kit ─────────────────────────────────────────── */
const K="#22355C", S="#C64A31", M="#7FC0AC", SA="#EFC98A", G="#8B99AF", BL="#E8907A";
let uid=0;
function draw(inner,vb){
  const id="w"+(++uid);
  return '<svg viewBox="'+(vb||"0 0 320 165")+'" xmlns="http://www.w3.org/2000/svg">'+
    '<defs><filter id="'+id+'"><feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="'+(uid*5)+'" result="n"/>'+
    '<feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter>'+
    '<marker id="a'+id+'" markerWidth="7" markerHeight="7" refX="4" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="'+K+'" stroke="none"/></marker>'+
    '<marker id="s'+id+'" markerWidth="7" markerHeight="7" refX="4" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="'+S+'" stroke="none"/></marker></defs>'+
    '<g filter="url(#'+id+')" fill="none" stroke="'+K+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">'+
    inner.replace(/#ARR#/g,'url(#a'+id+')').replace(/#ARS#/g,'url(#s'+id+')')+'</g></svg>';
}
const t=(x,y,s,o={})=>'<text x="'+x+'" y="'+y+'" font-size="'+(o.s||11)+'" fill="'+(o.c||G)+'" stroke="none" text-anchor="'+(o.a||"middle")+'" font-family="Fredoka,Nunito,sans-serif" font-weight="'+(o.w||400)+'">'+s+'</text>';
function face(x,y,sc,mood){
  const dot=r=>'<circle cx="'+(x-7*sc)+'" cy="'+y+'" r="'+r+'" fill="'+K+'" stroke="none"/><circle cx="'+(x+7*sc)+'" cy="'+y+'" r="'+r+'" fill="'+K+'" stroke="none"/>';
  let eyes=dot(2.4*sc), mouth='<path d="M'+(x-5*sc)+' '+(y+7*sc)+' q'+(5*sc)+' '+(5*sc)+' '+(10*sc)+' 0" stroke-width="2.2"/>';
  if(mood==="tired"){
    eyes='<path d="M'+(x-11*sc)+' '+y+' q'+(4*sc)+' '+(4.5*sc)+' '+(8*sc)+' 0" stroke-width="2.2"/><path d="M'+(x+3*sc)+' '+y+' q'+(4*sc)+' '+(4.5*sc)+' '+(8*sc)+' 0" stroke-width="2.2"/>';
    mouth='<path d="M'+(x-4*sc)+' '+(y+9*sc)+' q'+(4*sc)+' -'+(3*sc)+' '+(8*sc)+' 0" stroke-width="2.2"/>';
  }
  if(mood==="gone"){
    eyes='<path d="M'+(x-10*sc)+' '+(y-3*sc)+' l'+(6*sc)+' '+(6*sc)+' M'+(x-4*sc)+' '+(y-3*sc)+' l-'+(6*sc)+' '+(6*sc)+
         ' M'+(x+4*sc)+' '+(y-3*sc)+' l'+(6*sc)+' '+(6*sc)+' M'+(x+10*sc)+' '+(y-3*sc)+' l-'+(6*sc)+' '+(6*sc)+'" stroke-width="2.2"/>';
    mouth='<path d="M'+(x-4.5*sc)+' '+(y+8*sc)+' h'+(9*sc)+'" stroke-width="2.2"/>';
  }
  if(mood==="sad") mouth='<path d="M'+(x-5*sc)+' '+(y+10*sc)+' q'+(5*sc)+' -'+(5*sc)+' '+(10*sc)+' 0" stroke-width="2.2"/>';
  const blush='<circle cx="'+(x-15*sc)+'" cy="'+(y+5*sc)+'" r="'+(3.8*sc)+'" fill="'+BL+'" opacity=".5" stroke="none"/>'+
              '<circle cx="'+(x+15*sc)+'" cy="'+(y+5*sc)+'" r="'+(3.8*sc)+'" fill="'+BL+'" opacity=".5" stroke="none"/>';
  return blush+eyes+mouth;
}
const zzz=(x,y)=>t(x,y,"z",{s:9,c:G})+t(x+7,y-8,"z",{s:11,c:G})+t(x+16,y-18,"z",{s:13,c:G});
const clock=(x,y,r,lab)=>'<circle cx="'+x+'" cy="'+y+'" r="'+r+'" stroke-width="2.3"/>'+
  '<path d="M'+x+' '+(y-r*0.55)+' V'+y+' l'+(r*0.42)+' '+(r*0.3)+'" stroke-width="2.1"/>'+(lab?t(x,y+r+13,lab,{s:10.5,c:K,w:500}):'');

const ART={

/* CAFFEINE: the same cup, halving every five hours */
coffee:{cap:"Same cup, five hours later, then five more.",
 svg:draw(
  [[40,"3pm",1,"awake"],[140,"8pm",.5,""],[240,"1am",.25,"tired"]].map((c,i)=>{
    const x=c[0], lv=c[2], top=52, bot=104, fillTop=bot-(bot-top)*lv;
    return '<g>'+
      '<path d="M'+x+' '+top+' h50 l-6 52 h-38 z" fill="#fff" fill-opacity=".55" stroke-width="2.6"/>'+
      '<path d="M'+(x+2+(fillTop-top)*0.06)+' '+fillTop+' h'+(46-(fillTop-top)*0.12)+' l-'+(5*lv+1)+' '+(bot-fillTop)+' h-'+(38+(1-lv)*6)+' z" fill="'+SA+'" fill-opacity=".85" stroke-width="0"/>'+
      '<path d="M'+(x+52)+' '+(top+8)+' a11 11 0 0 1 0 20" stroke-width="2.4"/>'+
      face(x+25,74,.78,c[3]==="tired"?"tired":"")+
      t(x+25,124,c[1],{s:13,c:K,w:600})+
      t(x+25,139,Math.round(lv*100)+"% left",{s:10.5})+
      '</g>'+
      (i<2?'<path d="M'+(x+70)+' 78 h18" stroke="'+S+'" stroke-width="2.4" marker-end="#ARS#"/>'+
           t(x+80,66,"5 hrs",{s:10.5,c:S,w:600}):'');
  }).join('')+
  t(160,22,"caffeine left in you",{s:11.5,c:K,w:600})
 )},

/* LUNGS: the branch, then one bag magnified with the swap happening */
lungs:{cap:"Air stops at the bag. Oxygen crosses a wall two cells thick and gets on the blood.",
 svg:draw(
  '<path d="M74 20 v22 M74 42 c-14 0 -22 6 -30 12 M74 42 c14 0 22 6 30 12"/>'+
  '<path d="M44 54 c-24 4 -34 22 -34 44 0 20 10 30 24 30 11 0 17 -7 17 -20 v-48 c0 -5 -2 -7 -7 -6z" fill="'+M+'" fill-opacity=".22"/>'+
  '<path d="M104 54 c24 4 34 22 34 44 0 20 -10 30 -24 30 -11 0 -17 -7 -17 -20 v-48 c0 -5 2 -7 7 -6z" fill="'+M+'" fill-opacity=".22"/>'+
  face(38,92,.8)+
  [[112,88,5],[122,98,4],[110,106,3.5]].map(c=>'<circle cx="'+c[0]+'" cy="'+c[1]+'" r="'+c[2]+'" fill="'+SA+'" fill-opacity=".7" stroke-width="1.6"/>').join('')+
  '<path d="M128 96 c14 -6 24 -8 34 -8" stroke="'+G+'" stroke-width="1.8" stroke-dasharray="4 4" marker-end="#ARR#"/>'+
  '<circle cx="226" cy="78" r="44" fill="#fff" fill-opacity=".5" stroke-width="2.4"/>'+
  '<circle cx="222" cy="78" r="21" fill="'+SA+'" fill-opacity=".55" stroke-width="2.5"/>'+
  face(222,76,.6)+
  '<path d="M192 52 c22 -10 46 -6 58 12" stroke="'+S+'" stroke-width="4.5" stroke-linecap="round" opacity=".8"/>'+
  '<path d="M194 106 c22 10 46 6 58 -10" stroke="'+S+'" stroke-width="4.5" stroke-linecap="round" opacity=".8"/>'+
  '<path d="M214 44 v14" stroke="'+K+'" stroke-width="2.2" marker-end="#ARR#"/>'+
  '<path d="M238 96 v-16" stroke="'+G+'" stroke-width="2.2" marker-end="#ARR#"/>'+
  t(316,66,"O\u2082 in",{a:"end",s:11,c:K,w:600})+
  t(316,100,"CO\u2082 out",{a:"end",s:11,w:600})+
  t(226,142,"blood runs right past",{s:11,c:S,w:500})+
  t(60,148,"70 m\u00B2 folded up small",{s:11,c:K,w:500})
 )},

/* EYES: the lens changes shape, the muscle is what gets tired */
eye:{cap:"Close up, the muscle squeezes the lens fat. Far away, it lets go.",
 svg:draw(
  [[0,true],[164,false]].map(p=>{
    const x=p[0], close=p[1];
    return '<g transform="translate('+x+',0)">'+
    '<circle cx="86" cy="72" r="42" fill="#fff" fill-opacity=".6" stroke-width="2.6"/>'+
    '<path d="M46 54 c-12 6 -12 30 0 36" stroke-width="2.4"/>'+
    '<ellipse cx="56" cy="72" rx="'+(close?11:6)+'" ry="'+(close?16:19)+'" fill="'+M+'" fill-opacity=".45" stroke-width="2.4"/>'+

/* Scene layouts. Each takes short labels from the fact and draws a multi part
   picture around the subject's character, so a page without a bespoke drawing
   still shows something with information in it. */

/* place a character inside a scene: its own art is centred on (160,54) */
function place(key,x,y,s,mood){
  const inner=MASCOT_ART[key||"body"];
  if(!inner) return "";
  return '<g transform="translate('+x+','+y+') scale('+s+') translate(-160,-54)">'+inner+'</g>';
}
function wrap(str,max){
  const w=String(str).split(" "), lines=[]; let cur="";
  w.forEach(x=>{ if((cur+" "+x).trim().length<=max){ cur=(cur+" "+x).trim(); } else { if(cur)lines.push(cur); cur=x; } });
  if(cur) lines.push(cur);
  return lines.slice(0,3);
}
const lines=(arr,x,y,step,o)=>arr.map((l,i)=>t(x,y+i*step,l,o)).join("");

/* a → b → c, the shape of a process */
function sceneFlow(sp,col,char){
  const n=sp.items.length, gap=13, x0=74, span=314-x0;
  const w=(span-(n-1)*gap)/n;
  const cards=sp.items.map((it,i)=>{
    const x=x0+i*(w+gap), last=i===n-1;
    const ls=wrap(it,Math.floor((w-12)/5.0));
    return '<rect x="'+x+'" y="34" width="'+w+'" height="66" rx="14" fill="'+(last?tint(col,.16):tint(col,.07))+'" stroke="'+(last?col:K)+'" stroke-width="'+(last?2.6:2.2)+'"/>'+
      lines(ls,x+w/2,(ls.length===1?71:ls.length===2?63:56),14,{s:9.5,c:last?col:K,w:last?600:400})+
      (i<n-1?'<path d="M'+(x+w+2)+' 67 h'+(gap-6)+'" stroke="'+col+'" stroke-width="2.4" marker-end="#ARS#"/>':'');
  }).join("");
  return draw(place(char,38,66,.55)+cards, "0 0 320 122");
}

/* this against that, the shape of a comparison */
function nearShu(hex){
  const n=parseInt(hex.slice(1),16), m=parseInt(S.slice(1),16);
  const d=[16,8,0].reduce((a,sh)=>a+Math.pow(((n>>sh)&255)-((m>>sh)&255),2),0);
  return Math.sqrt(d)<60;
}
function sceneVs(sp,col,char){
  const okCol = (sp.bad && nearShu(col)) ? "#4F6070" : col;
  const panel=(sd,x0,bad)=>{
    const c=bad?S:okCol, w=144, cx=x0+w/2;
    const head=wrap(sd.l,17), val=sd.v?wrap(sd.v,20):[];
    return '<rect x="'+x0+'" y="46" width="'+w+'" height="84" rx="16" fill="'+tint(c,.09)+'" stroke="'+c+'" stroke-width="2.4"/>'+
      lines(head,cx,(val.length?76:88),14,{s:11.5,c:c,w:600})+
      lines(val,cx,(head.length===1?96:110),13,{s:10.5});
  };
  return draw(
    place(char,160,24,.42)+
    panel(sp.a,8,sp.bad==="a")+
    panel(sp.b,168,sp.bad==="b"),
    "0 0 320 142");
}

/* one thing, several labelled facts about it */
function sceneParts(sp,col,char){
  const rows=sp.items.slice(0,3);
  const ys=rows.length===2?[54,96]:[38,76,114];
  return draw(
    place(char,80,72,.92)+
    rows.map((it,i)=>{
      const y=ys[i], ls=wrap(it,22);
      return '<path d="M134 '+(72+(y-72)*.55)+' C160 '+(72+(y-72)*.8)+' 164 '+y+' 180 '+y+'" stroke="'+G+'" stroke-width="1.6"/>'+
        '<circle cx="180" cy="'+y+'" r="3.4" fill="'+col+'" stroke="none"/>'+
        lines(ls,190,y+4,13,{a:"start",s:10.5,c:K});
    }).join(""),
    "0 0 320 148");
}

function scene(sp,col,char){
  if(sp.t==="seq")  return sceneSeq(sp,col);
  if(sp.t==="lanes")return sceneLanes(sp,col);
  if(sp.t==="cmp")  return sceneCmp(sp,col);
  if(sp.t==="many") return sceneMany(sp,col);
  if(sp.t==="flow") return sceneFlow(sp,col,char);
  if(sp.t==="vs")   return sceneVs(sp,col,char);
  if(sp.t==="parts")return sceneParts(sp,col,char);
  return "";
}

/* badges */
const badge=(x,y,ok)=>'<circle cx="'+x+'" cy="'+y+'" r="13" fill="'+(ok?tint(M,.55):tint(S,.28))+'" stroke="'+(ok?"#3D8C74":S)+'" stroke-width="2.3"/>'+

     :'<path d="M'+(x-4.5)+' '+(y-4.5)+' l9 9 M'+(x+4.5)+' '+(y-4.5)+' l-9 9" stroke="'+S+'" stroke-width="2.6"/>');

function prop(spec,x,y,s){
  const name=typeof spec==="string"?spec:spec.p;
  const o=typeof spec==="string"?{}:spec;
  const f=PROPS[name]; if(!f) return "";
  return '<g transform="translate('+x+','+y+') scale('+(s||1)+')">'+f(o)+'</g>';
}

/* a → b → c, no words */
function sceneSeq(sp,col){
  const n=sp.items.length, step=300/n;
  return draw(sp.items.map((it,i)=>{
    const x=10+step*(i+.5);
    return prop(it,x,56,1)+
      (i<n-1?'<path d="M'+(x+step*.34)+' 56 h'+(step*.32)+'" stroke="'+col+'" stroke-width="2.6" marker-end="#ARS#"/>':'');
  }).join(""), "0 0 320 108");
}

/* this against that, with a tick or a cross */
function sceneCmp(sp,col){
  const side=(sd,cx,bad)=>{
    const ps=sd.props||[sd];
    const off=ps.length>2?[-36,0,36]:ps.length>1?[-27,27]:[0];
    return ps.map((p,i)=>prop(p,cx+off[i],50,ps.length>2?.7:ps.length>1?.86:1.05)).join("")+
      (sp.badge===false?"":badge(cx,100,!bad));
  };
  return draw(
    side(sp.a,80,sp.bad==="a")+
    '<path d="M160 18 v92" stroke="'+G+'" stroke-width="1.5" stroke-dasharray="5 5"/>'+
    side(sp.b,240,sp.bad==="b"),
    "0 0 320 124");
}

/* how much of each, shown by counting */
function sceneMany(sp,col){
  const row=(g,x0)=>{
    const n=g.n, per=Math.min(n,4), s=.62;
    return Array.from({length:n},(_,i)=>{
      const r=Math.floor(i/per), c=i%per;
      return prop(g.p,x0+c*33+(r?16:0),36+r*40,s);
    }).join("");
  };
  return draw(
    row(sp.a,26)+
    '<path d="M160 14 v92" stroke="'+G+'" stroke-width="1.5" stroke-dasharray="5 5"/>'+
    row(sp.b,190),
    "0 0 320 116");
}

      const x=30+i*56;
      return prop(it,x,y,.76)+
        (i<n-1?'<path d="M'+(x+19)+' '+y+' h13" stroke="'+(bad?S:col)+'" stroke-width="2.4" marker-end="'+(bad?'#ARS#':'#ARR#')+'"/>':'');
    }).join("")+badge(30+n*56-8,y,!bad);
  };
  return draw(
    lane(sp.a,40,sp.bad==="a")+
    '<path d="M14 78 h292" stroke="'+G+'" stroke-width="1.4" stroke-dasharray="5 5"/>'+
    lane(sp.b,116,sp.bad==="b"),
    "0 0 320 158");
}

{id:"baby-bones",c:"bones",t:"Babies have about 300 bones. You have 206.",
 w:"Nothing is lost. Skull plates, spine segments and parts of the pelvis start separate so a baby can grow and be born, then knit together."},

{id:"brain-energy-share",c:"brain",t:"Your brain is 2% of your weight and eats 20% of your energy.",
 w:"That barely changes between hard concentration and daydreaming. Most of it goes on keeping an electrical charge across nerve cell walls, which never stops."},

{id:"nerve-speed",c:"nerves",t:"Some of your nerves run at 120 metres a second. Others crawl at 1.",art:"nerve",
 w:"Fast ones are wrapped in insulation with gaps, so the signal skips gap to gap. Slow ones are bare and travel every millimetre. Stub your toe and the sharp signal arrives first, the deep ache a second later."},

{id:"kidney-filtering",art:"kidney",c:"kidneys",t:"Your kidneys filter 180 litres a day and put 99% of it back.",
 w:"They dump everything small out of the blood first, then reclaim the water, salt and sugar worth keeping. What is left is the litre or two you pass."},

{id:"liver-regrows",art:"liver",c:"liver",t:"The liver is the only organ inside you that regrows.",
 w:"Take away two thirds and the rest divides until the mass is back, usually within a few months. That is how living donors can give part of theirs."},

{id:"saliva-litres",c:"mouth",t:"You make up to one and a half litres of spit a day.",
 w:"It starts breaking down starch before food reaches your stomach, buffers acid, and carries calcium that repairs very early enamel damage."},

{id:"taste-buds-map",c:"taste",t:"The tongue map you were taught in school is wrong.",
 w:"Sweet, salty, sour, bitter and savoury are picked up all over the tongue. The zoned diagram came from a 1901 German paper mistranslated in 1942 and copied for decades. Your taste buds are also replaced about every 10 days."},

{id:"blink-rate-screens",art:"blink",c:"eyes",t:"You blink half as often at a screen.",
 w:"Normally 15 to 20 times a minute. Fewer blinks means the film of tears over your eye evaporates and does not get replaced, which is most of what people call screen eye strain.",
 a:["Blink hard and slowly ten times when your eyes feel gritty. A full closure spreads the oily layer that stops tears drying.",
    "Reduce the fan or air vent pointing at your face before reaching for drops."]},

{id:"eye-focus-distance",c:"eyes",t:"20 seconds of looking far away rests your eyes.",art:"eye",
 w:"A ring of muscle squeezes your lens fatter for close work. Distance is its relaxed shape, so looking far away is time off rather than effort.",
 a:["Pick one thing over 6 metres away you can see from your seat. Use the same one every time.",
    "Put the top of your screen at eye level or a bit below. Looking down slows tears drying out.",
    "Eyes burning by 4pm? Preservative free artificial tears, not the redness drops."]},

{id:"hair-cells-no-regrow",c:"hearing",t:"Above 85 decibels, your ears start taking damage.",art:"hair",
 w:"85dB is heavy traffic, and about 8 hours of it is a full day. A 100dB gig hits the same dose in 15 minutes. The tiny hairs that pick up sound shear off and humans cannot regrow them.",
 a:["Set it once: iPhone, Settings, Sounds and Haptics, Headphone Safety, 85dB.",
    "Foam plugs rated 20dB make a gig roughly 100 times safer to sit through.",
    "Ringing that lasts a day, or one ear going quiet, is a this week appointment."]},

{id:"smell-one-step",c:"smell",t:"Smell reaches your memory in one step. Every other sense detours.",art:"smell",
 w:"Sight, sound and touch queue at a relay station first. Smell arrives right beside the parts that store events and attach feelings to them.",
 a:["Lost your smell after an illness? Sniff four strong scents for 20 seconds each, twice a day, 12 weeks.",
    "Rose, eucalyptus, lemon and clove are the four used in the trials."]},

{id:"body-temp-36-6",c:"body",t:"Normal body temperature is not 37 degrees.",
 w:"That figure comes from measurements taken in 1851. Modern averages sit closer to 36.6, and your own swings about half a degree across the day, lowest in the early morning."},

{id:"fever-is-defence",c:"immunity",t:"A fever is your body turning the heat up on purpose.",
 w:"Your brain raises its own target temperature, which is why you shiver while already hot. Many bacteria and viruses copy themselves less well a couple of degrees up."},

{id:"bruise-colours",c:"body",t:"A bruise changes colour because your body is dismantling the spill.",
 w:"Red haemoglobin breaks down into green biliverdin, then yellow bilirubin, then gets cleared. The colour tells you roughly how old the bruise is."},

{id:"goosebumps",c:"body",t:"Goosebumps are tiny muscles pulling hairs you no longer have.",
 w:"In a furry animal, raised hair traps warm air and makes it look bigger. The muscles still fire in you. There is just nothing much left to lift."},

{id:"hiccups",c:"body",t:"A hiccup is your diaphragm twitching. The sound comes 35 milliseconds later.",
 w:"The twitch pulls air in, then your vocal cords snap shut and make the noise. Anything irritating the nerve loop can set it off, including a full stomach or fizzy drinks."},

{id:"yawn-contagious",c:"body",t:"Catching a yawn does not start until about age 4.",
 w:"It develops alongside the ability to read what other people are feeling, and it is weaker in people who find that harder."},

{id:"motion-sickness",c:"balance",t:"Travel sickness is your ears and eyes telling different stories.",
 w:"Your inner ear reports movement your eyes cannot see, and your brain reads the mismatch as a warning.",
 a:["Look at the horizon or take the front seat, so your eyes report the same motion your ears feel.",
    "On a boat or a coach, keeping your head still against a headrest helps more than staring at your phone."]},

{id:"standing-up-dip",c:"circulation",t:"Stand up fast and your blood pressure dips for a few seconds.",
 w:"Gravity drags blood towards your legs. Sensors in your neck spot the drop and tighten your vessels, but that takes a moment. The grey out is the gap.",
 a:["Pump your ankles ten times before getting out of bed, then sit on the edge for 20 seconds.",
    "Happening a lot? Ask about the timing of any blood pressure tablets. It is often movable.",
    "Actually fainting, or grey outs with chest pain, needs a real look."]},

{id:"hair-shedding",c:"hair",t:"Losing 50 to 100 hairs a day is normal.",
 w:"Each follicle runs its own cycle instead of matching its neighbours, so shedding spreads out. Hair grows about 1 cm a month."},

{id:"nail-growth",c:"nails",t:"Fingernails grow twice as fast as toenails.",
 w:"About 3.5mm a month against 1.6mm. Faster on your dominant hand, slower in winter and with age. A whole fingernail takes about six months to replace."},

{id:"wound-moist-healing",c:"healing",t:"Wounds heal faster covered than left to dry out.",
 w:"New skin cells travel across a moist surface more easily than they tunnel under a hard scab.",
 a:["Cover a graze with a plaster or a thin layer of ointment rather than letting it crust.",
    "Spreading redness, heat, or pus after day two means infection, not healing."]},

{id:"stomach-acid-strength",c:"stomach",t:"Your stomach acid could dissolve a razor blade.",
 w:"It runs at pH 1.5 to 3.5, close to battery acid. The stomach survives it by making a layer of mucus and replacing its own lining constantly."},

{id:"stomach-lining-renewal",c:"stomach",t:"Your stomach relines itself every few days.",
 w:"Cells at the surface are destroyed by the acid they contain, so the lining is rebuilt continuously. Painkillers like ibuprofen slow that rebuild, which is why they cause ulcers."},

{id:"small-intestine-length",c:"gut",t:"Your small intestine is about 6 metres long, coiled into your belly.",
 w:"Its wall is folded, then covered in finger shaped bumps, then each bump is covered in smaller ones. That is how a 6 metre tube ends up with the absorbing surface of a small flat."},

{id:"bladder-capacity",c:"bladder",t:"You feel the urge at half a bladder, not a full one.",
 w:"Stretch sensors start reporting around 250ml of a 400 to 600ml capacity. The feeling is a heads up, not an emergency."},

{id:"blood-volume-lap",c:"blood",t:"You hold about 5 litres of blood and it laps your body every minute.",
 w:"At rest that means the same blood passes your heart around 70 times an hour. During hard exercise the rate can quadruple."},

{id:"spleen-function",c:"spleen",t:"Your spleen is a filter that decides when red cells are past it.",
 w:"It squeezes blood through narrow gaps. Cells too stiff to pass get broken down, and the iron is recycled. It also stores platelets and helps fight certain bacteria."},

{id:"lymph-system",c:"lymph",t:"Your lymph system has no pump. It moves when you do.",
 w:"Fluid that leaks out of blood vessels is returned by vessels squeezed by your own muscles and breathing. That is part of why swelling settles when you walk about."},

{id:"bone-remodelling",c:"bones",t:"Your skeleton rebuilds itself roughly every 10 years.",
 w:"One set of cells dissolves old bone, another lays down new. Loading a bone tells it to build, which is why weight bearing exercise and not calcium alone protects bone strength."},

{id:"cartilage-no-blood",c:"joints",t:"Cartilage has no blood supply, so it barely heals.",
 w:"It is fed by joint fluid squeezed in and out as you move. That is also why gentle movement is usually better for a stiff joint than complete rest."},

{id:"tendon-vs-ligament",c:"joints",t:"Tendons join muscle to bone. Ligaments join bone to bone.",
 w:"Tendons transmit force and are built to stretch a little. Ligaments limit how far a joint travels, and a sprain is a stretched or torn one."},

{id:"muscle-fibre-types",c:"muscle",t:"You have two kinds of muscle fibre and you were born with the mix.",
 w:"Slow fibres resist fatigue, fast ones produce force quickly and tire. Training shifts their size and endurance a lot, and the ratio only a little."},

{id:"shivering-heat",c:"body",t:"Shivering can multiply your heat production by five.",
 w:"It is muscle contracting with no useful movement, so nearly all the energy comes out as heat. It is expensive, which is why it exhausts you."},

{id:"sweat-glands",c:"skin",t:"You have between 2 and 4 million sweat glands.",
 w:"Sweat itself is nearly odourless. The smell comes from skin bacteria breaking it down, which is why antibacterial deodorant works differently from antiperspirant."},

{id:"earwax-self-cleaning",art:"earwax",c:"ears",t:"Your ear canal cleans itself outward, like a conveyor belt.",
 w:"Skin in the canal migrates towards the opening, carrying wax with it.",
 a:["Do not put cotton buds in. They push wax against the eardrum and cause most of the blockages seen in clinics.",
    "If your ear is blocked, olive oil drops for a few days beats digging."]},

{id:"balance-inner-ear",c:"balance",t:"Your sense of balance runs on three fluid loops in each ear.",
 w:"They sit at right angles to each other, so movement in any direction tips fluid against sensing hairs. Infections and crystals loose in the loops both cause spinning dizziness."},

{id:"proprioception",c:"nerves",t:"You have a sense that tells you where your limbs are without looking.",
 w:"Sensors in muscles, tendons and joints report position constantly. Close your eyes and touch your nose. That is the sense working.",
 a:["Standing on one leg is a direct test. Under 10 seconds with eyes open is worth mentioning to a physio.",
    "Practising it while brushing your teeth is enough to improve it."]},

{id:"pupil-light-response",c:"eyes",t:"Your pupil changes size by a factor of about five.",
 w:"From roughly 2mm in bright light to 8mm in the dark. That is a 16 fold change in light let in, and it happens in under a second."},

{id:"blind-spot",c:"eyes",t:"Each eye has a blind spot and your brain paints over it.",
 w:"It is where the optic nerve leaves the retina, so there are no light sensors there. Your brain fills the gap with a guess based on what surrounds it."},

{id:"colour-vision-cones",c:"eyes",t:"You see colour with 6 million cells and darkness with 120 million.",
 w:"Cones handle colour and detail but need good light. Rods handle dim light and see no colour, which is why everything looks grey at night."},

{id:"night-vision-rods",c:"eyes",t:"Your eyes take about 25 minutes to fully adjust to darkness.",
 w:"A pigment in your rod cells has to rebuild, and one glance at a bright phone resets much of it.",
 a:["Use the dimmest red light you can if you need to see in the dark. Red light barely affects the pigment."]},

{id:"tears-three-types",c:"eyes",t:"You make three different kinds of tears.",
 w:"Basal ones keep the eye wet, reflex ones flush out onions and grit, and emotional ones have a different protein and hormone mix. Only humans seem to make the third kind."},

{id:"vocal-cords-pitch",c:"voice",t:"Your vocal cords vibrate 100 to 300 times a second when you speak.",
 w:"Pitch depends on their length and tension. They grow longer and thicker in puberty, which drops the voice.",
 a:["Losing your voice is usually swelling. Whispering strains the cords more than speaking quietly does.",
    "Hoarseness lasting over three weeks needs looking at, especially if you smoke."]},

{id:"tongue-muscle",c:"mouth",t:"Your tongue is eight muscles and it never fully rests.",
 w:"Four are anchored to bone and four are not, which is what lets it change shape so freely. It keeps working during sleep to hold your airway open."},

{id:"swallowing-airway",art:"swallow",c:"throat",t:"Every swallow shuts your airway for about a second.",
 w:"A flap folds over your windpipe while the food passes. Talking or laughing while swallowing interrupts the timing, which is what going down the wrong way means."},

{id:"appendix-function",c:"gut",t:"The appendix may be a safe house for gut bacteria.",
 w:"It is a dead end pocket off the large intestine. One theory with reasonable support is that it lets helpful bacteria repopulate the gut after an illness clears it out."},

{id:"gallbladder-bile",c:"liver",t:"Your gallbladder stores bile. Your liver makes it.",
 w:"Bile breaks fat into droplets small enough to be absorbed. Remove the gallbladder and bile just drips in continuously instead of arriving in a burst."},

{id:"pancreas-two-jobs",c:"pancreas",t:"Your pancreas does two unrelated jobs in one organ.",
 w:"Most of it makes digestive enzymes that go into your gut. A tiny fraction makes insulin and glucagon that go into your blood to set blood sugar."},

{id:"thyroid-metabolism",c:"hormones",t:"A gland in your neck sets the speed of nearly every cell.",
 w:"Thyroid hormone controls how fast you burn energy. Too little brings cold, tiredness and weight gain, too much brings heat, tremor and a racing heart.",
 a:["Both directions are common and both are diagnosed by one blood test.",
    "Persistent tiredness with feeling cold and dry skin is worth testing rather than pushing through."]},

{id:"adrenaline-response",c:"hormones",t:"Adrenaline hits in seconds. The stress hormone behind it takes minutes.",
 w:"Adrenaline speeds the heart and widens airways almost instantly. Cortisol follows over several minutes and keeps blood sugar available for longer."},

{id:"cortisol-rhythm",c:"hormones",t:"Your cortisol peaks about 30 minutes after you wake up.",
 w:"That rise is normal and helps you get going. It falls through the day and bottoms out around midnight, which is part of what sets your energy pattern."},

{id:"insulin-basics",art:"insulin",c:"blood sugar",t:"Insulin is the key that lets sugar out of your blood and into cells.",
 w:"Without it, sugar stays in the bloodstream no matter how much is there. Type 1 means the key is not made. Type 2 means the lock has stopped responding well."},

{id:"melatonin-darkness",c:"sleep",t:"Melatonin is a darkness signal, not a sleeping pill.",
 w:"Your brain releases it when light drops, telling the body night has started. It shifts timing more than it forces sleep.",
 a:["If you use it for jet lag, timing matters more than dose. Small doses in the local evening shift the clock.",
    "Dimming lights an hour before bed does the same job without a tablet."]},

{id:"immune-memory-cells",c:"immunity",t:"Your immune system keeps a written record of every infection you survive.",
 w:"Memory cells sit in your lymph nodes for years, so the second meeting with the same germ is fought off before you notice it. Vaccines create that record without the illness."}
];

/* Batch 2: sleep, food and drink, movement, heart and blood. */
const FACTS_2 = [
{id:"sleep-regularity",c:"sleep",t:"When you sleep matters about as much as how long.",
 w:"Your body clock only shifts about an hour a day. A two hour lie in on Saturday feels to your body like flying two time zones out and back by Monday.",
 a:["Anchor your wake time, not your bedtime. Same alarm seven days, Sunday included.",
    "Get outside within an hour of waking. Outdoors is 10,000 lux, your living room is 100.",
    "Need to shift your schedule? Move it 20 minutes every two days."]},

{id:"caffeine-half-life",c:"caffeine",t:"Half of a 3pm coffee is still in you at 8pm.",art:"coffee",
 w:"Caffeine takes about 5 hours to drop by half. It blocks the molecule that makes you feel sleepy, so the pressure to sleep keeps stacking up. You just cannot feel it.",
 a:["Stop 8 hours before bed. Bed at 11pm means nothing after 3pm.",
    "In one trial, coffee 6 hours before bed cost people an hour of sleep and nobody noticed.",
    "The sneaky ones: strong tea 50mg, cola 35mg, pre workout mixes 200mg or more."]},

{id:"alcohol-rem",c:"alcohol",t:"Alcohol gets you to sleep faster and then ruins the second half.",
 w:"It suppresses dreaming sleep early on, and as your body clears it the rebound breaks up the later hours. Eight hours in bed can still leave you wrecked.",
 a:["Finish drinking three hours before bed and the damage to the second half drops sharply.",
    "A glass of water per drink helps the hangover, not the sleep."]},

{id:"sleep-memory",c:"sleep",t:"Your brain files the day's memories while you sleep.",
 w:"The part that holds recent events replays them to long term storage overnight. People who sleep after learning recall clearly more than people awake the same hours.",
 a:["Read the difficult thing last, right before bed, rather than first thing in a long session."]},

{id:"morning-light",c:"light",t:"Your living room is a hundred times dimmer than an overcast street.",
 w:"About 100 lux inside against 10,000 outside under cloud. Only outdoor strength light sets your body clock firmly.",
 a:["Ten minutes outside within an hour of waking does more for your sleep than anything you do at bedtime.",
    "Through a window does not count. Glass and distance cut the intensity hard."]},

{id:"nap-20-minutes",c:"sleep",t:"A nap of 20 minutes helps. Forty leaves you worse.",
 w:"Past roughly half an hour you fall into deep sleep, and waking out of that brings 15 to 30 minutes of fog before you are useful.",
 a:["Set the alarm for 25 minutes to allow for dropping off.",
    "Nap before 3pm. Later ones eat into the sleep pressure you need that night."]},

{id:"jet-lag-rate",c:"travel",t:"Jet lag clears at about one time zone a day.",
 w:"Flying east is harder because your natural rhythm runs slightly longer than 24 hours, so delaying is easier than advancing.",
 a:["Flying east: get bright morning light at the destination and avoid it in the evening.",
    "Flying west: seek evening light instead. Same trick, opposite end of the day."]},

{id:"sleep-apnea-snoring",c:"sleep",t:"Loud snoring with pauses is a medical problem, not a joke.",
 w:"The airway collapses repeatedly, oxygen drops and the brain wakes just enough to reopen it, sometimes hundreds of times a night. It raises blood pressure and stroke risk.",
 a:["If a partner has seen you stop breathing, or you wake unrefreshed after 8 hours, ask for a sleep test.",
    "Sleeping on your side rather than your back reduces it in many people."]},

{id:"blue-light-vs-late",c:"sleep",t:"Your phone at night is mostly a problem for what you do on it.",
 w:"Screen light does suppress the darkness hormone, but at typical phone brightness the effect is modest. Staying engaged for another hour costs you far more sleep than the colour of the light."},

{id:"bedroom-temperature",c:"sleep",t:"Your body has to drop about a degree to fall asleep.",
 w:"That is why a cool room helps and a hot one does not. Around 18 degrees suits most people.",
 a:["A warm bath an hour before bed works by the opposite logic: blood moves to the skin, then you cool faster afterwards."]},

{id:"salt-in-food",c:"salt",t:"70% of your salt was in the food before you bought it.",
 w:"Bread, ham, cheese, sauces and takeaways carry most of it. The shaker is a small slice, which is why putting it away barely moves your total.",
 a:["Read labels per 100g, not per portion. Over 1.5g is high, under 0.3g is low.",
    "Two swaps in the high column beat any amount of care at the table. Usually bread and a sauce.",
    "Give it two weeks. Your taste for salt drops once you stop topping it up."]},

{id:"potassium-blood-pressure",c:"nutrition",t:"Potassium partly cancels salt's effect on blood pressure.",
 w:"The target is around 3,500mg a day and most people fall well short.",
 a:["A baked potato has about 900mg, a cup of beans 750mg, a banana 420mg.",
    "If you have kidney disease this is different. Ask before increasing potassium."]},

{id:"fibre-gap",c:"nutrition",t:"Most adults eat about two thirds of the fibre they need.",
 w:"Roughly 17g against a 27g target. Gut bacteria ferment fibre into the fatty acids that feed the cells lining your colon, so those cells are fed by bacteria rather than by your blood.",
 a:["Add it slowly over two weeks. A sudden jump causes exactly the bloating that makes people quit.",
    "Beans, oats and leaving skins on do more than any supplement."]},

{id:"water-eight-glasses",c:"water",t:"The eight glasses rule was never based on evidence.",
 w:"It appears to come from a 1945 recommendation that counted water in food, which got dropped in the retelling. Around a quarter of your fluid arrives in what you eat.",
 a:["Pale straw urine means you are fine. Dark yellow means drink. That beats counting."]},

{id:"fullness-20-minutes",art:"fullness",c:"eating",t:"Your fullness signal arrives about 20 minutes late.",
 w:"Hormones from the stomach and intestine have to travel through the bloodstream to your brain. Eat faster than that and you can pass comfortable without noticing."},

{id:"vitamin-c-humans",c:"vitamins",t:"Humans are one of the few animals that cannot make vitamin C.",
 w:"The gene for the last step is broken in all of us. Most mammals build their own in the liver. About 10mg a day prevents scurvy, and guidelines set 85mg for everything else."},

{id:"b12-sources",c:"vitamins",t:"Vitamin B12 is made by bacteria, not by plants or animals.",
 w:"Animals accumulate it, which is why it reaches you through meat, eggs, dairy or fortified food. Your liver holds years of stores, so a shortfall can hide for a long time then show up as nerve damage.",
 a:["Eating no animal products means a supplement or fortified food, not a maybe.",
    "Metformin and long term acid reducers both lower absorption. Worth a blood test if you take either."]},

{id:"fat-soluble-vitamins",c:"vitamins",t:"Four vitamins build up in you. The rest wash out.",
 w:"A, D, E and K dissolve in fat and are stored in your liver and fat tissue, so big doses can accumulate to harmful levels. B and C dissolve in water and leave in urine the same day."},

{id:"vitamin-d-latitude",c:"vitamins",t:"Above about 37 degrees latitude, winter sun cannot make vitamin D.",
 w:"The angle is too low for the right wavelength to get through the atmosphere. Stockholm, London and most of northern Europe get nothing usable from October to March.",
 a:["Northern winters are the clearest case for a supplement. 10 micrograms a day is the usual public advice.",
    "Darker skin needs longer exposure for the same amount, so shortfall is more common."]},

{id:"iron-absorption-vitamin-c",c:"nutrition",t:"Vitamin C can triple the iron you absorb from a plant meal.",
 w:"Iron from plants is in a form your gut takes up poorly. Vitamin C converts it to a form that crosses much more easily.",
 a:["Squeeze lemon on beans or spinach, or have fruit with the meal rather than after it.",
    "Tea and coffee with a meal cut iron absorption. Move them an hour either side."]},

{id:"calcium-and-bone",c:"bones",t:"Calcium alone does not build strong bone. Load does.",
 w:"Calcium is the raw material, but bone only lays it down where it is being stressed. That is why an astronaut with a perfect diet still loses bone in orbit.",
 a:["Anything where your feet hit the ground counts: walking, stairs, dancing, skipping.",
    "Swimming and cycling are good for you and near useless for bone."]},

{id:"protein-spread",c:"nutrition",t:"Your body cannot store spare protein for later.",
 w:"Excess above what is needed at that moment gets burned or converted, so a huge dinner does not make up for a day without any.",
 a:["Spreading protein across meals is more useful than piling it into one, especially over 60."]},

{id:"wholegrain-vs-refined",c:"nutrition",t:"Refining grain removes the two parts that carried the nutrients.",
 w:"The bran and the germ hold the fibre, most vitamins and the oils. White flour keeps the starchy middle, which is why it is often fortified afterwards to put some back."},

{id:"ultra-processed",c:"nutrition",t:"In a controlled trial, people ate 500 calories a day more on ultra processed food.",
 w:"Same calories and nutrients offered, free to eat as much as they wanted. They ate faster and consumed more without reporting feeling any fuller.",
 a:["Speed is the lever you can actually pull. Food that needs chewing slows you down on its own."]},

{id:"breakfast-not-required",c:"eating",t:"Skipping breakfast is not inherently bad for you.",
 w:"The old claim came largely from studies where breakfast skippers differed in many other ways. Trials moving breakfast around show small effects. What you eat across the day matters more than when it starts."},

{id:"chewing-and-digestion",c:"eating",t:"Digestion starts in your mouth, not your stomach.",
 w:"Chewing breaks food into pieces enzymes can reach, and saliva starts on the starch. Swallowing large pieces just moves the work downstream."},

{id:"coffee-and-liver",c:"caffeine",t:"Coffee drinkers show lower rates of liver disease, repeatedly.",
 w:"The link holds in large studies including decaf drinkers, which suggests something other than caffeine. It is observational, so it shows an association rather than proof."},

{id:"tea-and-iron",c:"nutrition",t:"Tea with a meal can halve the iron you absorb from it.",
 w:"Tannins in tea bind iron in the gut. It matters most for people who are already low, and for plant based diets.",
 a:["Move tea and coffee an hour away from meals if your iron is low."]},

{id:"alcohol-units-liver",c:"alcohol",t:"Your liver clears about one unit of alcohol an hour, and that cannot be sped up.",
 w:"Coffee, cold showers and fresh air change how awake you feel, not how much alcohol is in your blood. Nothing on sale changes the rate."},

{id:"sugar-in-drinks",c:"nutrition",t:"Liquid sugar does not register as food.",
 w:"Drinks pass the stomach fast and produce far less fullness than the same sugar eaten, so the calories add rather than replace.",
 a:["Swapping one daily sugary drink for water or a diet version is the single largest easy cut for most people."]},

{id:"artificial-sweeteners",c:"nutrition",t:"Sweeteners are safe at normal intakes and not obviously helpful.",
 w:"Decades of testing show no credible link to cancer at real world doses. Whether they help weight is genuinely unsettled, with trials leaning slightly positive and observational data leaning the other way."},

{id:"cooking-oil-smoke-point",c:"cooking",t:"When oil smokes, it has started breaking down.",
 w:"Past that point it produces irritants and off flavours. Extra virgin olive oil smokes around 190 degrees, refined oils higher.",
 a:["If a pan smokes before the food goes in, take it off the heat and start again rather than pushing through."]},

{id:"microwave-nutrients",c:"cooking",t:"Microwaving keeps more nutrients than boiling.",
 w:"Vitamins are lost to heat and to water. Microwaving uses less of both, so boiled broccoli loses more vitamin C than microwaved."},

{id:"frozen-vegetables",c:"food",t:"Frozen vegetables often beat fresh on nutrients.",
 w:"They are frozen within hours of picking, while fresh produce can spend a week in transport and storage losing vitamin C the whole way."},

{id:"food-poisoning-danger-zone",c:"food safety",t:"Bacteria multiply fastest between 5 and 60 degrees.",
 w:"In that range a single bacterium can become millions in a few hours. Cooked food left out is the classic route.",
 a:["Two hours out is the working limit, one hour if it is hot weather.",
    "Cool leftovers fast in a shallow dish rather than a deep pot, then refrigerate."]},

{id:"rice-bacillus",c:"food safety",t:"Reheating does not fix rice that sat out.",
 w:"Spores survive cooking and produce a toxin at room temperature. The toxin is not destroyed by heat, so reheating harder does nothing.",
 a:["Cool rice within an hour and refrigerate. Use within a day."]},

{id:"honey-infants",c:"food safety",t:"No honey before a baby's first birthday.",
 w:"It can carry dormant botulism spores. An adult gut suppresses them easily. An infant gut has not yet built the bacteria that do that, and the illness is severe."},

{id:"chicken-washing",c:"food safety",t:"Washing raw chicken spreads bacteria around your kitchen.",
 w:"Water droplets carry campylobacter up to half a metre onto surfaces and clothes. Cooking kills what is on the meat anyway.",
 a:["Do not rinse it. Pat dry with kitchen paper if you need to, and bin the paper."]},

{id:"cutting-board-cross-contamination",c:"food safety",t:"The board is a more common cause of illness than the meat.",
 w:"Raw juices left on a surface transfer to whatever is chopped next, usually salad that will not be cooked.",
 a:["Cut salad and bread before raw meat, not after, if you only have one board."]},

{id:"leftovers-cooling",c:"food safety",t:"Hot food in the fridge warms everything around it.",

  }catch(e){ return null; } },
  async set(v){ try{
    if(window.storage&&window.storage.set){ await window.storage.set(KEY,v); return; }
    localStorage.setItem(KEY,v);
  }catch(e){} }
};

let state={ saved:[], assigned:{}, seen:[], cycle:1, streak:0, lastOpen:null };
const el=id=>document.getElementById(id);
const DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const dayKey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

async function loadState(){
  const raw=await store.get();
  if(raw){ try{ Object.assign(state, JSON.parse(raw)); }catch(e){} }
  for(const k of ["saved","seen"]) if(!Array.isArray(state[k])) state[k]=[];
  if(typeof state.assigned!=="object"||!state.assigned) state.assigned={};
  if(!state.cycle) state.cycle=1;
  /* drop saves and assignments pointing at facts that no longer exist */
  state.saved=state.saved.filter(id=>BY_ID[id]);
  state.seen=state.seen.filter(id=>BY_ID[id]);
  for(const d of Object.keys(state.assigned)) if(!BY_ID[state.assigned[d]]) delete state.assigned[d];
}
const persist=()=>store.set(JSON.stringify(state));

/* Today's fact is chosen once and written down. Adding facts later cannot move it. */
function factForToday(){
  const k=dayKey(new Date());
  if(state.assigned[k]) return BY_ID[state.assigned[k]];

  let pool=ORDER.filter(f=>!state.seen.includes(f.id));
  if(!pool.length){ state.cycle++; state.seen=[]; pool=ORDER.slice(); }   /* pool exhausted: start a review pass */

  /* rotate the starting point each cycle so a second pass is not the same order */
  const pick=pool[ hash("cycle"+state.cycle) % pool.length ];
  state.assigned[k]=pick.id;
  state.seen.push(pick.id);

  const keep=Object.keys(state.assigned).sort().slice(-120);   /* keep four months of history */
  const trimmed={}; keep.forEach(d=>trimmed[d]=state.assigned[d]);
  state.assigned=trimmed;
  persist();
  return pick;
}

function updateStreak(){
  const now=new Date(), k=dayKey(now);
  if(state.lastOpen===k) return;
  const y=new Date(now); y.setDate(y.getDate()-1);
  state.streak=(state.lastOpen===dayKey(y))?(state.streak||0)+1:1;
  state.lastOpen=k; persist();
}

/* Explanatory doodle where one exists, otherwise the subject's character. */
function artFor(f){
  if(f.art && ART[f.art])
    return '<figure class="doodle">'+ART[f.art].svg+'<figcaption>'+ART[f.art].cap+'</figcaption></figure>';
  const char=MASCOT_FOR[f.sub]||"body";
  const sp=SCENES[f.id];
  if(sp){
    const svg=scene(sp,CATS[f.cat].color,char);
    if(svg) return '<figure class="doodle">'+svg+'</figure>';
  }
  const m=MASCOT[char];
  return m?'<figure class="doodle mascot">'+m+'</figure>':'';
}

/* ── rendering ────────────────────────────────────────── */
let viewing=null, isToday=true, todayFact=null;

function render(){
  const f=viewing, now=new Date();
  el("period").textContent=MONTHS[now.getMonth()]+" "+now.getFullYear();
  el("num").textContent=now.getDate();
  el("num").classList.toggle("sun",now.getDay()===0);
  el("dow").textContent=DAYS[now.getDay()];
  const cat=CATS[f.cat];
  el("chipLabel").textContent=cat.label;
  el("chip").style.color=cat.color;
  el("chip").style.background=tint(cat.color,.10);
  el("chipDot").style.background=cat.color;
  el("fact").textContent=f.t;
  el("art").innerHTML=artFor(f);
  el("why").textContent=f.w;
  el("openLabel").textContent=f.a?"Why? And what to do":"Why?";
  el("doWrap").hidden=!f.a;
  el("doList").innerHTML=(f.a||[]).map((s,n)=>'<li><b>'+(n+1)+'</b><span>'+s+'</span></li>').join("");
  el("panel").classList.remove("open");
  el("openBtn").setAttribute("aria-expanded","false");

  const on=state.saved.includes(f.id);
  el("save").classList.toggle("on",on);
  el("saveLabel").textContent=on?"Saved":"Save";
  el("savedCount").textContent=state.saved.length;
  el("streak").textContent=state.streak>1?state.streak+" days in a row":"Day one";

  renderSheet();
}
function renderSheet(){
  const b=el("sheetBody");
  if(!state.saved.length){ b.innerHTML='<p class="empty">Nothing saved yet.</p>'; return; }
  const groups={};
  state.saved.forEach(id=>{ const f=BY_ID[id]; if(f) (groups[f.cat]=groups[f.cat]||[]).push(f); });
  const keys=Object.keys(CATS).filter(k=>groups[k]);
  b.innerHTML=keys.map(k=>{
    const c=CATS[k].color;
    return '<div class="grp">'+
      '<span class="ghead" style="color:'+c+';background:'+tint(c,.10)+'">'+
        '<s style="background:'+c+'"></s>'+CATS[k].label+'<b>'+groups[k].length+'</b></span>'+
      '<ul style="border-color:'+tint(c,.28)+'">'+groups[k].map(f=>'<li>'+f.t+'</li>').join("")+'</ul>'+
    '</div>';
  }).join("");
}
function show(f,today){
  const p=el("page"); p.classList.add("tearing");
  setTimeout(()=>{ p.classList.remove("tearing"); viewing=f; isToday=!!today; render(); window.scrollTo({top:0}); },450);
}

el("openBtn").onclick=()=>{
  const o=el("panel").classList.toggle("open");
  el("openBtn").setAttribute("aria-expanded",o?"true":"false");
};
el("save").onclick=()=>{
  const id=viewing.id, i=state.saved.indexOf(id);
  if(i>=0) state.saved.splice(i,1); else state.saved.push(id);
  persist(); render();
};
el("savedPill").onclick=()=>{ el("sheet").hidden=!el("sheet").hidden; };

if("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}

(async()=>{
  await loadState();
  updateStreak();
  todayFact=factForToday();
  viewing=todayFact; isToday=true;
  render();
})();


</script>
