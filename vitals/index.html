<style>
:root{
  --kon:#22355C;
  --ai:#3C5B86;
  --ai-soft:#7788A3;
  --shu:#C64A31;
  --shu-tint:rgba(198,74,49,.08);
  --shu-tint-2:rgba(198,74,49,.16);
  --mint:#7FC0AC;
  --sand:#EFC98A;
  --paper:#F0EDE6;
  --paper-2:#FAF8F3;
  --line:#D8D3C7;
  --sumi:#232833;
  --wall:#16213A;
  --disp:"Fredoka",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --sans:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;
  padding:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-right,0px) + 13px) calc(env(safe-area-inset-bottom,0px) + 26px) calc(env(safe-area-inset-left,0px) + 13px);
  font-family:var(--sans);color:var(--sumi);
  background:radial-gradient(130% 90% at 50% -10%,#22335A 0%,var(--wall) 55%,#101A2E 100%);
  display:flex;flex-direction:column;align-items:center;gap:12px;
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
}
.wrap{width:100%;max-width:412px}
.mock{width:100%;max-width:412px;display:flex;align-items:center;gap:8px;color:#8FA1BD;font-size:11.5px;padding:0 2px 2px}
.mock i{flex:1;height:1px;background:rgba(255,255,255,.10)}

.board{background:linear-gradient(#2E4269,#26375A);border-radius:20px 20px 5px 5px;padding:13px 18px;
  display:flex;align-items:center;justify-content:space-between;box-shadow:0 12px 30px rgba(0,0,0,.40)}
.brand{display:flex;align-items:center;gap:9px;color:#F3F0EA;font-size:18px;font-weight:500;font-family:var(--disp)}
.period{color:#A3B4CC;font-size:12.5px}
.board-r{display:flex;align-items:center;gap:10px}
.lang{font-family:var(--disp);font-size:12px;line-height:1;padding:6px 11px;border-radius:999px;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);color:#E3EAF5;cursor:pointer}
.lang:active{background:rgba(255,255,255,.20)}

.stack{position:relative}
.stack::before,.stack::after{content:'';position:absolute;left:7px;right:7px;top:3px;bottom:-5px;
  background:#E2DED4;border-radius:0 0 4px 4px;z-index:0}
.stack::after{left:13px;right:13px;top:7px;bottom:-10px;background:#D4CFC3}
.page{position:relative;z-index:1;background:var(--paper);padding:16px 20px 22px;border-radius:0 0 4px 4px;transform-origin:50% 0}
.page::after{content:'';position:absolute;left:0;right:0;bottom:-8px;height:9px;background:var(--paper);
  -webkit-mask-image:radial-gradient(circle at 6px 0,transparent 5.4px,#000 6px);
  mask-image:radial-gradient(circle at 6px 0,transparent 5.4px,#000 6px);
  -webkit-mask-size:12px 9px;mask-size:12px 9px}

.head{display:flex;align-items:flex-start;justify-content:space-between}
.date{display:flex;align-items:baseline;gap:10px}
.num{font-family:var(--disp);font-size:64px;font-weight:600;letter-spacing:-.02em;line-height:.9;color:var(--kon)}
.num.sun{color:var(--shu)}
.dow{font-size:13.5px;font-weight:600;color:var(--ai-soft)}
.bm{width:40px;height:40px;border-radius:14px;border:1.5px solid var(--line);background:transparent;
  display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.bm svg{width:17px;height:17px;fill:none;stroke:var(--ai);stroke-width:1.9;stroke-linejoin:round}
.bm.on{background:var(--shu);border-color:var(--shu)}
.bm.on svg{fill:#fff;stroke:#fff}

.chip{display:inline-flex;align-items:center;gap:6px;margin:14px 0 12px;padding:6px 13px;border-radius:999px;
  background:var(--shu-tint);color:var(--shu);font-size:12.5px;font-weight:600;font-family:var(--disp)}
.chip s{width:5px;height:5px;border-radius:50%;background:var(--shu);text-decoration:none}

.fact{font-family:var(--disp);font-size:24px;line-height:1.32;font-weight:500;letter-spacing:-.01em;margin:0;color:var(--kon)}

.doodle{margin:18px 0 4px;background:var(--paper-2);border:1.5px dashed rgba(34,53,92,.18);border-radius:22px;padding:10px 10px 8px}
.doodle svg{width:100%;height:auto;display:block}
.doodle.mascot{padding:6px 10px 4px;background:transparent;border-style:dotted;border-color:rgba(34,53,92,.13)}
.doodle figcaption{font-size:12px;color:var(--ai-soft);line-height:1.45;margin:6px 8px 2px;text-align:center}

.open-btn{position:relative;width:100%;margin-top:20px;border:0;cursor:pointer;font-family:var(--disp);
  background:var(--shu);color:#fff;border-radius:20px;padding:15px 52px;
  display:flex;align-items:center;justify-content:center;text-align:center;font-size:17px;font-weight:500;
  box-shadow:0 6px 16px rgba(198,74,49,.26)}
.open-btn:active{transform:translateY(1px)}
.open-btn .ic{position:absolute;right:15px;top:50%;width:27px;height:27px;border-radius:50%;
  background:rgba(255,255,255,.22);display:grid;place-items:center;
  transform:translateY(-50%);transition:transform .25s ease}
.open-btn .ic svg{width:12px;height:12px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round}
.open-btn[aria-expanded="true"]{border-radius:20px 20px 0 0;box-shadow:none}
.open-btn[aria-expanded="true"] .ic{transform:translateY(-50%) rotate(180deg)}

.panel{overflow:hidden;max-height:0;transition:max-height .32s cubic-bezier(.3,0,.2,1)}
.panel.open{max-height:800px}
.panel-in{background:var(--shu-tint);border-radius:0 0 20px 20px;padding:16px 17px 18px}
.lbl{font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--shu)}
.why{font-size:15px;line-height:1.55;color:#3E4653;margin:8px 0 0}
.do{margin-top:16px;padding-top:14px;border-top:1.5px dashed var(--shu-tint-2)}
.do ul{list-style:none;margin:9px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.do li{display:flex;gap:10px;font-size:15px;line-height:1.5;color:#3E4653}
.do li b{flex:0 0 auto;width:21px;height:21px;border-radius:50%;background:var(--shu);color:#fff;
  font-family:var(--disp);font-size:12px;font-weight:500;display:grid;place-items:center;margin-top:1px}

.acts{display:flex;gap:9px;margin-top:14px}
.save,.share{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;padding:15px 12px;
  border-radius:20px;border:2px solid var(--shu);background:transparent;color:var(--shu);
  font-family:var(--disp);font-size:16.5px;cursor:pointer}
.save svg{width:18px;height:18px;fill:none;stroke:var(--shu);stroke-width:2;stroke-linejoin:round}
.share{border-color:var(--line);color:var(--kon)}
.share svg{width:18px;height:18px;fill:none;stroke:var(--kon);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.share:disabled{opacity:.55}
.pill.today{background:var(--shu);border-color:var(--shu);color:#fff;font-family:var(--disp)}
.sheet li button{all:unset;display:block;width:100%;cursor:pointer;font:inherit;color:inherit;line-height:1.45;padding:2px 0}
.sheet li button:active{color:var(--shu)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:5;display:flex;align-items:center;gap:4px;
  padding:6px;border-radius:999px;background:rgba(22,33,58,.92);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(12px)}
.nav button{width:38px;height:38px;border-radius:999px;border:0;background:rgba(255,255,255,.09);color:#DCE5F2;font-family:var(--disp);font-size:17px;cursor:pointer}
.nav span{color:#A3B4CC;font-size:12.5px;min-width:70px;text-align:center;font-family:var(--disp)}
.save.on{background:var(--shu);color:#fff}
.save.on svg{fill:#fff;stroke:#fff}
.save:active{transform:translateY(1px)}
.doodle.mascot{background:transparent;border-style:dotted;border-color:rgba(34,53,92,.14);padding:8px 10px 6px}
.tear{display:none;
  color:var(--kon);font-family:var(--disp);font-size:16px;font-weight:400;cursor:pointer}
.tear:active{background:#E5E1D6}

.bar{width:100%;max-width:412px;display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.10);color:#C9D5E6;font-size:13px;font-family:var(--sans);cursor:pointer}
.pill .badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--shu);color:#fff;
  font-family:var(--disp);font-size:11.5px;display:grid;place-items:center}
.pill.plain{cursor:default}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--mint)}

.sheet{width:100%;max-width:412px;background:var(--paper-2);border-radius:22px;padding:16px 18px}
.sheet h2{font-family:var(--disp);font-size:16px;font-weight:500;margin:0 0 10px;color:var(--kon)}
.sheet .grp+.grp{margin-top:18px}
.sheet .ghead{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;
  background:var(--shu-tint);color:var(--shu);font-family:var(--disp);font-size:12.5px;font-weight:600}
.sheet .ghead s{width:5px;height:5px;border-radius:50%;background:var(--shu);text-decoration:none}
.sheet .ghead b{font-weight:400;opacity:.65;font-size:11.5px}
.sheet ul{list-style:none;margin:10px 0 0;padding:0 0 0 4px;display:flex;flex-direction:column;gap:10px;
  border-left:1.5px dashed var(--shu-tint-2)}
.sheet li{font-size:14.5px;line-height:1.45;padding-left:12px;color:var(--sumi)}
.sheet .empty{font-size:13.5px;color:var(--ai-soft);margin:0}
.fine{width:100%;max-width:412px;color:#63738D;font-size:11.5px;padding:2px 4px}

.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:5;display:flex;align-items:center;gap:4px;
  padding:6px;border-radius:999px;background:rgba(22,33,58,.92);border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(12px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.nav button{width:38px;height:38px;border-radius:999px;border:0;background:rgba(255,255,255,.09);color:#DCE5F2;
  font-family:var(--disp);font-size:17px;cursor:pointer}
.nav span{color:#A3B4CC;font-size:12.5px;min-width:70px;text-align:center;font-family:var(--disp)}

@keyframes tear{0%{transform:rotate(0) translateY(0);opacity:1}
 30%{transform:rotate(2deg) translateY(5px)}100%{transform:rotate(-7deg) translateY(460px);opacity:0}}
.tearing{animation:tear .48s cubic-bezier(.42,.1,.72,1) forwards}
@media (prefers-reduced-motion:reduce){.tearing{animation:none;opacity:0}.panel{transition:none}}
button:focus-visible{outline:2.5px solid var(--shu);outline-offset:3px}
[hidden]{display:none!important}   /* .pill sets display:flex, which outranks the browser default for [hidden] */
</style>

<div class="bar">

/* ── doodle kit ─────────────────────────────────────────── */
const K="#22355C", S="#C64A31", M="#7FC0AC", SA="#EFC98A", G="#8B99AF", BL="#E8907A";
let uid=0;
function draw(inner,vb){
  const id="w"+(++uid);
  return '<svg viewBox="'+(vb||"0 0 320 165")+'" xmlns="http://www.w3.org/2000/svg">'+
    '<defs><filter id="'+id+'"><feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="'+(uid*5)+'" result="n"/>'+
    '<feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter>'+
    '<marker id="a'+id+'" markerWidth="7" markerHeight="7" refX="4" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="'+K+'" stroke="none"/></marker>'+
    '<marker id="s'+id+'" markerWidth="7" markerHeight="7" refX="4" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="'+S+'" stroke="none"/></marker></defs>'+
    '<g filter="url(#'+id+')" fill="none" stroke="'+K+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">'+
    inner.replace(/#ARR#/g,'url(#a'+id+')').replace(/#ARS#/g,'url(#s'+id+')')+'</g></svg>';
}
const t=(x,y,s,o={})=>'<text x="'+x+'" y="'+y+'" font-size="'+(o.s||11)+'" fill="'+(o.c||G)+'" stroke="none" text-anchor="'+(o.a||"middle")+'" font-family="Fredoka,Nunito,sans-serif" font-weight="'+(o.w||400)+'">'+s+'</text>';
function face(x,y,sc,mood){
  const dot=r=>'<circle cx="'+(x-7*sc)+'" cy="'+y+'" r="'+r+'" fill="'+K+'" stroke="none"/><circle cx="'+(x+7*sc)+'" cy="'+y+'" r="'+r+'" fill="'+K+'" stroke="none"/>';
  let eyes=dot(2.4*sc), mouth='<path d="M'+(x-5*sc)+' '+(y+7*sc)+' q'+(5*sc)+' '+(5*sc)+' '+(10*sc)+' 0" stroke-width="2.2"/>';
  if(mood==="tired"){
    eyes='<path d="M'+(x-11*sc)+' '+y+' q'+(4*sc)+' '+(4.5*sc)+' '+(8*sc)+' 0" stroke-width="2.2"/><path d="M'+(x+3*sc)+' '+y+' q'+(4*sc)+' '+(4.5*sc)+' '+(8*sc)+' 0" stroke-width="2.2"/>';
    mouth='<path d="M'+(x-4*sc)+' '+(y+9*sc)+' q'+(4*sc)+' -'+(3*sc)+' '+(8*sc)+' 0" stroke-width="2.2"/>';
  }
  if(mood==="gone"){
    eyes='<path d="M'+(x-10*sc)+' '+(y-3*sc)+' l'+(6*sc)+' '+(6*sc)+' M'+(x-4*sc)+' '+(y-3*sc)+' l-'+(6*sc)+' '+(6*sc)+
         ' M'+(x+4*sc)+' '+(y-3*sc)+' l'+(6*sc)+' '+(6*sc)+' M'+(x+10*sc)+' '+(y-3*sc)+' l-'+(6*sc)+' '+(6*sc)+'" stroke-width="2.2"/>';
    mouth='<path d="M'+(x-4.5*sc)+' '+(y+8*sc)+' h'+(9*sc)+'" stroke-width="2.2"/>';
  }
  if(mood==="sad") mouth='<path d="M'+(x-5*sc)+' '+(y+10*sc)+' q'+(5*sc)+' -'+(5*sc)+' '+(10*sc)+' 0" stroke-width="2.2"/>';
  const blush='<circle cx="'+(x-15*sc)+'" cy="'+(y+5*sc)+'" r="'+(3.8*sc)+'" fill="'+BL+'" opacity=".5" stroke="none"/>'+
              '<circle cx="'+(x+15*sc)+'" cy="'+(y+5*sc)+'" r="'+(3.8*sc)+'" fill="'+BL+'" opacity=".5" stroke="none"/>';
  return blush+eyes+mouth;
}
const zzz=(x,y)=>t(x,y,"z",{s:9,c:G})+t(x+7,y-8,"z",{s:11,c:G})+t(x+16,y-18,"z",{s:13,c:G});
const clock=(x,y,r,lab)=>'<circle cx="'+x+'" cy="'+y+'" r="'+r+'" stroke-width="2.3"/>'+

const ART={

/* CAFFEINE: the same cup, halving every five hours */
coffee:{cap:"Same cup, five hours later, then five more.",
 svg:draw(
  [[40,"3pm",1,"awake"],[140,"8pm",.5,""],[240,"1am",.25,"tired"]].map((c,i)=>{

      face(x+25,74,.78,c[3]==="tired"?"tired":"")+
      t(x+25,124,c[1],{s:13,c:K,w:600})+
      t(x+25,139,Math.round(lv*100)+"% left",{s:10.5})+
      '</g>'+
      (i<2?'<path d="M'+(x+70)+' 78 h18" stroke="'+S+'" stroke-width="2.4" marker-end="#ARS#"/>'+
           t(x+80,66,"5 hrs",{s:10.5,c:S,w:600}):'');
  }).join('')+
  t(160,22,"caffeine left in you",{s:11.5,c:K,w:600})
 )},

/* LUNGS: the branch, then one bag magnified with the swap happening */
lungs:{cap:"Air stops at the bag. Oxygen crosses a wall two cells thick and gets on the blood.",

/* tint of a category colour, for pill backgrounds */
function tint(hex, a){
  const n=parseInt(hex.slice(1),16);
  return "rgba("+(n>>16)+","+((n>>8)&255)+","+(n&255)+","+a+")";
}

/* Scene layouts. Each takes short labels from the fact and draws a multi part
   picture around the subject's character, so a page without a bespoke drawing
   still shows something with information in it. */

/* place a character inside a scene: its own art is centred on (160,54) */
function place(key,x,y,s,mood){
  const inner=MASCOT_ART[key||"body"];
  if(!inner) return "";
  return '<g transform="translate('+x+','+y+') scale('+s+') translate(-160,-54)">'+inner+'</g>';
}
function wrap(str,max){
  const w=String(str).split(" "), lines=[]; let cur="";
  w.forEach(x=>{ if((cur+" "+x).trim().length<=max){ cur=(cur+" "+x).trim(); } else { if(cur)lines.push(cur); cur=x; } });
  if(cur) lines.push(cur);
  return lines.slice(0,3);
}
const lines=(arr,x,y,step,o)=>arr.map((l,i)=>t(x,y+i*step,l,o)).join("");

/* a → b → c, the shape of a process */
function sceneFlow(sp,col,char){
  const n=sp.items.length, gap=13, x0=74, span=314-x0;
  const w=(span-(n-1)*gap)/n;
  const cards=sp.items.map((it,i)=>{
    const x=x0+i*(w+gap), last=i===n-1;
    const ls=wrap(it,Math.floor((w-12)/5.0));
    return '<rect x="'+x+'" y="34" width="'+w+'" height="66" rx="14" fill="'+(last?tint(col,.16):tint(col,.07))+'" stroke="'+(last?col:K)+'" stroke-width="'+(last?2.6:2.2)+'"/>'+
      lines(ls,x+w/2,(ls.length===1?71:ls.length===2?63:56),14,{s:9.5,c:last?col:K,w:last?600:400})+
      (i<n-1?'<path d="M'+(x+w+2)+' 67 h'+(gap-6)+'" stroke="'+col+'" stroke-width="2.4" marker-end="#ARS#"/>':'');
  }).join("");
  return draw(place(char,38,66,.55)+cards, "0 0 320 122");
}

/* this against that, the shape of a comparison */
function nearShu(hex){
  const n=parseInt(hex.slice(1),16), m=parseInt(S.slice(1),16);
  const d=[16,8,0].reduce((a,sh)=>a+Math.pow(((n>>sh)&255)-((m>>sh)&255),2),0);
  return Math.sqrt(d)<60;
}
function sceneVs(sp,col,char){
  const okCol = (sp.bad && nearShu(col)) ? "#4F6070" : col;
  const panel=(sd,x0,bad)=>{
    const c=bad?S:okCol, w=144, cx=x0+w/2;
    const head=wrap(sd.l,17), val=sd.v?wrap(sd.v,20):[];
    return '<rect x="'+x0+'" y="46" width="'+w+'" height="84" rx="16" fill="'+tint(c,.09)+'" stroke="'+c+'" stroke-width="2.4"/>'+
      lines(head,cx,(val.length?76:88),14,{s:11.5,c:c,w:600})+
      lines(val,cx,(head.length===1?96:110),13,{s:10.5});
  };
  return draw(
    place(char,160,24,.42)+
    panel(sp.a,8,sp.bad==="a")+
    panel(sp.b,168,sp.bad==="b"),
    "0 0 320 142");
}

/* one thing, several labelled facts about it */
function sceneParts(sp,col,char){
  const rows=sp.items.slice(0,3);
  const ys=rows.length===2?[54,96]:[38,76,114];
  return draw(
    place(char,80,72,.92)+
    rows.map((it,i)=>{
      const y=ys[i], ls=wrap(it,22);
      return '<path d="M134 '+(72+(y-72)*.55)+' C160 '+(72+(y-72)*.8)+' 164 '+y+' 180 '+y+'" stroke="'+G+'" stroke-width="1.6"/>'+
        '<circle cx="180" cy="'+y+'" r="3.4" fill="'+col+'" stroke="none"/>'+
        lines(ls,190,y+4,13,{a:"start",s:10.5,c:K});
    }).join(""),
    "0 0 320 148");
}

function scene(sp,col,char){
  if(sp.t==="seq")  return sceneSeq(sp,col);
  if(sp.t==="lanes")return sceneLanes(sp,col);
  if(sp.t==="cmp")  return sceneCmp(sp,col);
  if(sp.t==="many") return sceneMany(sp,col);
  if(sp.t==="flow"||sp.t==="vs"||sp.t==="parts") return "";   /* retired: text cards */
  if(sp.t==="vs")   return sceneVs(sp,col,char);
  if(sp.t==="parts")return sceneParts(sp,col,char);
  return "";
}

/* badges */
const badge=(x,y,ok)=>'<circle cx="'+x+'" cy="'+y+'" r="13" fill="'+(ok?tint(M,.55):tint(S,.28))+'" stroke="'+(ok?"#3D8C74":S)+'" stroke-width="2.3"/>'+

/* overlays any prop can carry:
   flags:n   small sparkles meaning "good stuff in here" (nutrients, protection)
   cross     a red X through the object
   scale     draw it bigger or smaller than its neighbours, for more and less */
const sparkle=(x,y,r)=>'<path transform="translate('+x+','+y+') scale('+r+')" d="M0 -6 L1.7 -1.7 L6 0 L1.7 1.7 L0 6 L-1.7 1.7 L-6 0 L-1.7 -1.7 Z" fill="#3D8C74" stroke="none"/>';
const FLAG_SPOTS=[[17,-21,1.35],[26,-8,1.05],[6,-28,.9]];
function prop(spec,x,y,s){
  const name=typeof spec==="string"?spec:spec.p;
  const o=typeof spec==="string"?{}:spec;
  const f=PROPS[name]; if(!f) return "";
  const sc=(s||1)*(o.scale||1);
  let inner=f(o);
  if(o.flags) inner+=FLAG_SPOTS.slice(0,Math.min(3,o.flags)).map(p=>sparkle(p[0],p[1],p[2])).join("");
  if(o.cross) inner+='<path d="M-15 -15 L15 15 M15 -15 L-15 15" stroke="'+S+'" stroke-width="3.2"/>';
  return '<g transform="translate('+x+','+y+') scale('+sc+')">'+inner+'</g>';
}

/* a → b → c, no words */
function sceneSeq(sp,col){
  const n=sp.items.length, step=300/n, sc=n<=3?1.3:1.05;
  return draw(sp.items.map((it,i)=>{
    const x=10+step*(i+.5);
    return prop(it,x,64,sc)+
      (i<n-1?'<path d="M'+(x+step*.36)+' 64 h'+(step*.28)+'" stroke="'+col+'" stroke-width="2.6" marker-end="#ARS#"/>':'');
  }).join(""), "0 0 320 128");
}

/* this against that, with a tick or a cross */
function sceneCmp(sp,col){
  const side=(sd,cx,bad)=>{
    const ps=sd.props||[sd];
    const off=ps.length>2?[-46,0,46]:ps.length>1?[-34,34]:[0];
    const sc=ps.length>2?.95:ps.length>1?1.2:1.5;
    return ps.map((p,i)=>prop(p,cx+off[i],58,sc)).join("")+
      (sp.badge===false?"":badge(cx,122,!bad));
  };
  return draw(
    side(sp.a,80,sp.bad==="a")+
    '<path d="M160 18 v118" stroke="'+G+'" stroke-width="1.5" stroke-dasharray="5 5"/>'+
    side(sp.b,240,sp.bad==="b"),
    "0 0 320 146");
}

/* how much of each, shown by counting */
function sceneMany(sp,col){
  const row=(g,x0)=>{
    const n=g.n, per=Math.min(n,4), s=.72;
    return Array.from({length:n},(_,i)=>{
      const r=Math.floor(i/per), c=i%per;
      return prop(g.p,x0+c*35+(r?17:0),38+r*44,s);
    }).join("");
  };
  const badges=sp.bad?badge(80,112,sp.bad!=="a")+badge(240,112,sp.bad!=="b"):"";
  return draw(
    row(sp.a,26)+
    '<path d="M160 14 v'+(sp.bad?112:100)+'" stroke="'+G+'" stroke-width="1.5" stroke-dasharray="5 5"/>'+
    row(sp.b,190)+badges,
    "0 0 320 "+(sp.bad?136:124));
}

/* two lanes, the good route and the poor one */
function sceneLanes(sp,col){
  const lane=(g,y,bad)=>{
    const n=g.items.length;
    return g.items.map((it,i)=>{
      const x=32+i*62;
      return prop(it,x,y,.92)+
        (i<n-1?'<path d="M'+(x+23)+' '+y+' h14" stroke="'+(bad?S:col)+'" stroke-width="2.4" marker-end="'+(bad?'#ARS#':'#ARR#')+'"/>':'');
    }).join("")+badge(32+n*62-10,y,!bad);
  };
  return draw(
    lane(sp.a,44,sp.bad==="a")+
    '<path d="M14 88 h292" stroke="'+G+'" stroke-width="1.4" stroke-dasharray="5 5"/>'+
    lane(sp.b,132,sp.bad==="b"),
    "0 0 320 176");
}

/* Batch 1: body, organs, senses. Ids are permanent. Never renamed, never reused. */
const FACTS_1 = [
{id:"lungs-air-bags",c:"lungs",t:"Your lungs hold up to 500 million tiny air bags.",art:"lungs",
 w:"Flattened out they would cover about 70 square metres. Oxygen crosses a wall two cells thick with nothing pushing it. It drifts to where there is less of it.",
 a:["If stairs got harder this year, tell a doctor in those words. The breathing test takes 10 minutes.",
    "In cold air, breathe through your nose. It warms and wets the air better than your mouth."]},

{id:"blink-rate-screens",art:"blink",c:"eyes",t:"You blink half as often at a screen.",
 w:"Normally 15 to 20 times a minute. Fewer blinks means the film of tears over your eye evaporates and does not get replaced, which is most of what people call screen eye strain.",
 a:["Blink hard and slowly ten times when your eyes feel gritty. A full closure spreads the oily layer that stops tears drying.",
    "Reduce the fan or air vent pointing at your face before reaching for drops."]},

{id:"eye-focus-distance",c:"eyes",t:"20 seconds of looking far away rests your eyes.",art:"eye",
 w:"A ring of muscle squeezes your lens fatter for close work. Distance is its relaxed shape, so looking far away is time off rather than effort.",
 a:["Pick one thing over 6 metres away you can see from your seat. Use the same one every time.",
    "Put the top of your screen at eye level or a bit below. Looking down slows tears drying out.",
    "Eyes burning by 4pm? Preservative free artificial tears, not the redness drops."]},

{id:"hair-cells-no-regrow",c:"hearing",t:"Above 85 decibels, your ears start taking damage.",art:"hair",
 w:"85dB is heavy traffic, and about 8 hours of it is a full day. A 100dB gig hits the same dose in 15 minutes. The tiny hairs that pick up sound shear off and humans cannot regrow them.",
 a:["Set it once: iPhone, Settings, Sounds and Haptics, Headphone Safety, 85dB.",
    "Foam plugs rated 20dB make a gig roughly 100 times safer to sit through.",
    "Ringing that lasts a day, or one ear going quiet, means see a doctor this week."]},

{id:"smell-one-step",c:"smell",t:"Smell reaches your memory in one step. Every other sense detours.",art:"smell",
 w:"Sight, sound and touch queue at a relay station first. Smell arrives right beside the parts that store events and attach feelings to them.",
 a:["Lost your smell after an illness? Sniff four strong scents for 20 seconds each, twice a day, 12 weeks.",
    "Rose, eucalyptus, lemon and clove are the four used in the trials."]},

{id:"body-temp-36-6",c:"body",t:"Normal body temperature is not 37 degrees.",
 w:"That figure comes from measurements taken in 1851. Modern averages sit closer to 36.6, and your own swings about half a degree across the day, lowest in the early morning.",
 a:["Measure your own temperature on a few normal days and write the number down. A fever is a rise from your baseline, not from 37.", "Take it at the same time of day. Morning readings run about half a degree lower than evening ones."]},

{id:"fever-is-defence",c:"immunity",t:"A fever is your body turning the heat up on purpose.",
 w:"Your brain raises its own target temperature, which is why you shiver while already hot. Many bacteria and viruses copy themselves less well a couple of degrees up.",
 a:["Treat how the person feels, not the number. Fluids, rest, paracetamol if they are miserable.", "Get help for a baby under 3 months with any fever, anyone over 39.5, or a fever lasting more than 3 days.", "A fever with a stiff neck, a rash that does not fade under a glass, or confusion is an emergency."]},

{id:"bruise-colours",c:"body",t:"A bruise changes colour because your body is dismantling the spill.",
 w:"The red pigment from the blood breaks down into a green one, then a yellow one, then gets cleared away. The colour tells you roughly how old the bruise is.",
 a:["Bruises that appear without a knock, or keep appearing in odd places, need a blood test.", "One that is still there after 2 weeks, or is getting bigger, is worth showing a doctor."]},

{id:"motion-sickness",c:"balance",t:"Travel sickness is your ears and eyes telling different stories.",
 w:"Your inner ear reports movement your eyes cannot see, and your brain reads the mismatch as a warning.",
 a:["Look at the horizon or take the front seat, so your eyes report the same motion your ears feel.",
    "On a boat or a coach, keeping your head still against a headrest helps more than staring at your phone."]},

{id:"standing-up-dip",c:"circulation",t:"Stand up fast and your blood pressure dips for a few seconds.",
 w:"Gravity drags blood towards your legs. Sensors in your neck spot the drop and tighten your vessels, but that takes a moment. The grey out is the gap.",
 a:["Pump your ankles ten times before getting out of bed, then sit on the edge for 20 seconds.",
    "Happening a lot? Ask about the timing of any blood pressure tablets. It is often movable.",
    "Fainting outright, or grey outs with chest pain, needs a doctor."]},

{id:"hair-shedding",c:"hair",t:"Losing 50 to 100 hairs a day is normal.",
 w:"Each follicle runs its own cycle instead of matching its neighbours, so shedding spreads out. Hair grows about 1 cm a month.",
 a:["Counting hairs is not the test. Bald patches, a widening parting, or handfuls after washing for over 3 months are.", "Sudden shedding often follows illness, stress or a diet change by about 3 months. Iron and thyroid are the two blood tests to ask for."]},

{id:"wound-moist-healing",c:"healing",t:"Wounds heal faster covered than left to dry out.",
 w:"New skin cells travel across a moist surface more easily than they tunnel under a hard scab.",
 a:["Cover a graze with a plaster or a thin layer of ointment rather than letting it crust.",
    "Spreading redness, heat, or pus after day two means infection, not healing."]},

{id:"bladder-capacity",c:"bladder",t:"You feel the urge at half a bladder, not a full one.",
 w:"Stretch sensors start reporting around 250ml of a 400 to 600ml capacity. The feeling is a heads up, not an emergency.",
 a:["Do not go just in case. Going at the first twinge trains the bladder to signal earlier and earlier.", "If you are going more than 8 times a day, hold off 5 more minutes each time for two weeks. That retrains it."]},

{id:"lymph-system",c:"lymph",t:"Your lymph system has no pump. It moves when you do.",
 w:"Fluid that seeps out of your blood vessels is pushed back up by your muscles as they move. That is part of why swelling settles when you walk about.",
 a:["Swollen ankles after a flight or a desk day: walk for 10 minutes and raise your legs above heart level for 20.", "Calf raises while standing in a queue pump the same system. 20 of them, whenever you think of it."]},

{id:"cartilage-no-blood",c:"joints",t:"Cartilage has no blood supply, so it barely heals.",
 w:"It is fed by joint fluid squeezed in and out as you move. That is also why gentle movement is usually better for a stiff joint than complete rest.",
 a:["A stiff joint wants gentle movement, not rest. Move it through its full range every hour you are awake.", "Swimming and cycling work cartilage without pounding it, which is why both are recommended for worn knees."]},

{id:"earwax-self-cleaning",art:"earwax",c:"ears",t:"Your ear canal cleans itself outward, like a conveyor belt.",
 w:"Skin in the canal migrates towards the opening, carrying wax with it.",
 a:["Do not put cotton buds in. They push wax against the eardrum and cause most of the blockages seen in clinics.",
    "If your ear is blocked, olive oil drops for a few days beats digging."]},

{id:"proprioception",c:"nerves",t:"You have a sense that tells you where your limbs are without looking.",
 w:"Sensors in muscles, tendons and joints report position constantly. Close your eyes and touch your nose. That is the sense working.",
 a:["Standing on one leg is a direct test. Under 10 seconds with eyes open is worth mentioning to a physio.",
    "Practising it while brushing your teeth is enough to improve it."]},

{id:"night-vision-rods",c:"eyes",t:"Your eyes take about 25 minutes to fully adjust to darkness.",
 w:"A pigment in your rod cells has to rebuild, and one glance at a bright phone resets much of it.",
 a:["Use the dimmest red light you can if you need to see in the dark. Red light barely affects the pigment."]},

{id:"vocal-cords-pitch",c:"voice",t:"Your vocal cords vibrate 100 to 300 times a second when you speak.",
 w:"Pitch depends on their length and tension. They grow longer and thicker in puberty, which drops the voice.",
 a:["Losing your voice is usually swelling. Whispering strains the cords more than speaking quietly does.",
    "Hoarseness lasting over three weeks needs looking at, especially if you smoke."]},

{id:"thyroid-metabolism",c:"hormones",t:"A gland in your neck sets the speed of nearly every cell.",
 w:"Thyroid hormone controls how fast you burn energy. Too little brings cold, tiredness and weight gain, too much brings heat, tremor and a racing heart.",
 a:["Both directions are common and both are diagnosed by one blood test.",
    "Persistent tiredness with feeling cold and dry skin is worth testing rather than pushing through."]},

{id:"melatonin-darkness",c:"sleep",t:"Melatonin is a darkness signal, not a sleeping pill.",
 w:"Your brain releases it when light drops, telling the body night has started. It shifts timing more than it forces sleep.",
 a:["If you use it for jet lag, timing matters more than dose. Small doses in the local evening shift the clock.",
    "Dimming lights an hour before bed does the same job without a tablet."]},

];

/* Batch 2: sleep, food and drink, movement, heart and blood. */
const FACTS_2 = [
{id:"sleep-regularity",c:"sleep",t:"When you sleep matters about as much as how long.",
 w:"Your body clock only shifts about an hour a day. A two hour lie in on Saturday feels to your body like flying two time zones out and back by Monday.",
 a:["Anchor your wake time, not your bedtime. Same alarm seven days, Sunday included.",
    "Get outside within an hour of waking. Outdoor light is about a hundred times brighter than your living room, even on a grey day.",
    "Need to shift your schedule? Move it 20 minutes every two days."]},

{id:"caffeine-half-life",c:"caffeine",t:"Half of a 3pm coffee is still in you at 8pm.",art:"coffee",
 w:"Caffeine takes about 5 hours to drop by half. It blocks the molecule that makes you feel sleepy, so the pressure to sleep keeps stacking up. You just cannot feel it.",
 a:["Stop 8 hours before bed. Bed at 11pm means nothing after 3pm.",
    "In one trial, coffee 6 hours before bed cost people an hour of sleep and nobody noticed.",
    "The sneaky ones: strong tea 50mg, cola 35mg, pre workout mixes 200mg or more."]},

{id:"alcohol-rem",c:"alcohol",t:"Alcohol gets you to sleep faster and then ruins the second half.",
 w:"It suppresses dreaming sleep early on, and as your body clears it the rebound breaks up the later hours. Eight hours in bed can still leave you wrecked.",
 a:["Finish drinking three hours before bed and the damage to the second half drops sharply.",
    "A glass of water per drink helps the hangover, not the sleep."]},

{id:"sleep-memory",c:"sleep",t:"Your brain files the day's memories while you sleep.",
 w:"The part that holds recent events replays them into long term storage overnight. People who sleep after learning remember clearly more than people awake for the same hours.",
 a:["Read the difficult thing last, right before bed, rather than first thing in a long session."]},

{id:"morning-light",c:"light",t:"Your living room is a hundred times dimmer than an overcast street.",
 w:"Brightness is measured in lux: about 100 inside, 10,000 outside under cloud. Only outdoor strength light sets your body clock firmly.",
 a:["Ten minutes outside within an hour of waking does more for your sleep than anything you do at bedtime.",
    "Through a window does not count. Glass and distance cut the intensity hard."]},

{id:"nap-20-minutes",c:"sleep",t:"A nap of 20 minutes helps. Forty leaves you worse.",
 w:"Past roughly half an hour you fall into deep sleep, and waking out of that brings 15 to 30 minutes of fog before you are useful.",
 a:["Set the alarm for 25 minutes to allow for dropping off.",
    "Nap before 3pm. Later ones eat into the sleep pressure you need that night."]},

{id:"jet-lag-rate",c:"travel",t:"Jet lag clears at about one time zone a day.",
 w:"Flying east is harder because your natural rhythm runs slightly longer than 24 hours, so pushing bedtime later is easier than pulling it earlier.",
 a:["Flying east: get bright morning light at the destination and avoid it in the evening.",
    "Flying west: seek evening light instead. Same trick, opposite end of the day."]},

{id:"sleep-apnea-snoring",c:"sleep",t:"Loud snoring with pauses is a medical problem, not a joke.",
 w:"The airway collapses repeatedly, oxygen drops and the brain wakes just enough to reopen it, sometimes hundreds of times a night. It raises blood pressure and stroke risk.",
 a:["If a partner has seen you stop breathing, or you wake unrefreshed after 8 hours, ask for a sleep test.",
    "Sleeping on your side rather than your back reduces it in many people."]},

{id:"blue-light-vs-late",c:"sleep",t:"Your phone at night is mostly a problem for what you do on it.",
 w:"Screen light does hold back melatonin, the darkness hormone, but at normal phone brightness the effect is small. Staying engaged for another hour costs you far more sleep than the colour of the light.",
 a:["Set a phone curfew, not a night mode. Pick a time, put the phone to charge somewhere out of reach of the bed.", "If you need an alarm, buy a 10 dollar alarm clock. That removes the reason to have the phone within arm's reach."]},

{id:"bedroom-temperature",c:"sleep",t:"Your body has to drop about a degree to fall asleep.",
 w:"That is why a cool room helps and a hot one does not. Around 18 degrees suits most people.",
 a:["A warm bath an hour before bed works by the opposite logic: blood moves to the skin, then you cool faster afterwards."]},

{id:"salt-in-food",c:"salt",t:"70% of your salt was in the food before you bought it.",
 w:"Bread, ham, cheese, sauces and takeaways carry most of it. The shaker is a small slice, which is why putting it away barely moves your total.",
 a:["Read labels per 100g, not per portion. Over 1.5g is high, under 0.3g is low.",
    "Swap two of the high ones for lower versions. That beats any amount of care at the table. Usually it is bread and a sauce.",
    "Give it two weeks. Your taste for salt drops once you stop topping it up."]},

{id:"potassium-blood-pressure",c:"nutrition",t:"Potassium partly cancels salt's effect on blood pressure.",
 w:"The target is around 3,500mg a day and most people fall well short.",
 a:["A baked potato has about 900mg, a cup of beans 750mg, a banana 420mg.",
    "If you have kidney disease this is different. Ask before increasing potassium."]},

{id:"fibre-gap",c:"nutrition",t:"Most adults eat about two thirds of the fibre they need.",
 w:"Roughly 17g against a 27g target. Your gut bacteria eat the fibre and turn it into the fuel that feeds the lining of your bowel. No fibre, hungry lining.",
 a:["Add it slowly over two weeks. A sudden jump causes exactly the bloating that makes people quit.",
    "Beans, oats and leaving skins on do more than any supplement."]},

{id:"water-eight-glasses",c:"water",t:"The eight glasses rule was never based on evidence.",
 w:"It appears to come from a 1945 recommendation that counted water in food, which got dropped in the retelling. Around a quarter of your fluid arrives in what you eat.",
 a:["Pale straw urine means you are fine. Dark yellow means drink. That beats counting."]},

{id:"fullness-20-minutes",art:"fullness",c:"eating",t:"Your fullness signal arrives about 20 minutes late.",
 w:"Hormones from the stomach and intestine have to travel through the bloodstream to your brain. Eat faster than that and you can pass comfortable without noticing.",
 a:["Put your fork down between mouthfuls. Meals that take 20 minutes let the signal catch up before you overshoot.", "Serve the second helping only after a 10 minute wait. Most of the time you will not want it."]},

{id:"b12-sources",c:"vitamins",t:"Vitamin B12 is made by bacteria, not by plants or animals.",
 w:"Animals build it up in their bodies, which is why it reaches you through meat, eggs, dairy, or food that has had B12 added. Your liver holds years of stores, so a shortfall can hide for a long time then show up as nerve damage.",
 a:["Eating no animal products means a supplement or food with B12 added, every day, not a maybe.",
    "Metformin, a diabetes tablet, and long term heartburn tablets both cut how much you absorb. Worth a blood test if you take either."]},

{id:"fat-soluble-vitamins",c:"vitamins",t:"Four vitamins build up in you. The rest wash out.",
 w:"A, D, E and K dissolve in fat and are stored in your liver and fat tissue, so big doses can accumulate to harmful levels. B and C dissolve in water and leave in urine the same day.",
 a:["Check supplement labels for vitamins A, D, E and K and add up the total if you take more than one product.", "Vitamin A over 3,000 micrograms a day, or vitamin D over 100 micrograms a day, is where harm starts."]},

{id:"vitamin-d-latitude",c:"vitamins",t:"In northern Europe, winter sun is too low to make vitamin D.",
 w:"The sun sits too low in the sky for the right kind of light to reach your skin. Roughly anywhere north of Madrid gets nothing usable from October to March.",
 a:["Northern winters are the clearest case for a supplement. 10 micrograms a day is the usual public advice.",
    "Darker skin needs longer exposure for the same amount, so shortfall is more common."]},

{id:"iron-absorption-vitamin-c",c:"nutrition",t:"Vitamin C can triple the iron you absorb from a plant meal.",
 w:"Iron from plants is in a form your gut takes up poorly. Vitamin C converts it to a form that crosses much more easily.",
 a:["Squeeze lemon on beans or spinach, or have fruit with the meal rather than after it.",
    "Tea and coffee with a meal cut iron absorption. Move them an hour either side."]},

{id:"calcium-and-bone",c:"bones",t:"Calcium alone does not build strong bone. Load does.",
 w:"Calcium is the raw material, but bone only lays it down where it is being stressed. That is why an astronaut with a perfect diet still loses bone in orbit.",
 a:["Anything where your feet hit the ground counts: walking, stairs, dancing, skipping.",
    "Swimming and cycling are good for you and near useless for bone."]},

{id:"protein-spread",c:"nutrition",t:"Your body cannot store spare protein for later.",
 w:"Anything beyond what is needed at that moment gets burned for energy or turned into fat, so a huge dinner does not make up for a day without any.",
 a:["Spreading protein across meals is more useful than piling it into one, especially over 60."]},

{id:"wholegrain-vs-refined",c:"nutrition",t:"White flour is wheat with the nutritious parts taken out.",
 w:"A wheat grain has an outer skin and a tiny seed inside, and those two parts hold the fibre and most of the vitamins. White flour is just the starchy middle. Because so much is lost, many countries make manufacturers add a few vitamins back in afterwards. That is what fortified means on a label.",
 a:["Swap one thing, not your whole diet. Wholegrain bread or brown rice, whichever you eat most.", "Read the ingredients, not the front. Wholegrain has to be the first ingredient, not just in the name."]},

{id:"ultra-processed",c:"nutrition",t:"In a controlled trial, people ate 500 calories a day more on ultra processed food.",
 w:"Same calories and nutrients offered, free to eat as much as they wanted. They ate faster and consumed more without reporting feeling any fuller.",
 a:["Eating speed is the part you can control. Food that needs chewing slows you down on its own."]},

{id:"tea-and-iron",c:"nutrition",t:"Tea with a meal can halve the iron you absorb from it.",
 w:"Tannins in tea bind iron in the gut. It matters most for people who are already low, and for plant based diets.",
 a:["Move tea and coffee an hour away from meals if your iron is low."]},

{id:"alcohol-units-liver",c:"alcohol",t:"Your liver clears about one unit of alcohol an hour, and that cannot be sped up.",
 w:"Coffee, cold showers and fresh air change how awake you feel, not how much alcohol is in your blood. Nothing on sale changes the rate.",
 a:["Count units, not drinks. A large glass of wine is 3 units, a pint of strong lager 3, a double spirit 2.", "If you had 4 units at midnight, your blood is not clear until about 4am, whatever coffee or sleep you had.", "Two or three alcohol free days a week give the liver time it does not otherwise get."]},

{id:"sugar-in-drinks",c:"nutrition",t:"Liquid sugar does not register as food.",
 w:"Drinks pass the stomach fast and produce far less fullness than the same sugar eaten, so the calories add rather than replace.",
 a:["Swapping one daily sugary drink for water or a diet version is the single largest easy cut for most people."]},

{id:"cooking-oil-smoke-point",c:"cooking",t:"When oil smokes, it has started breaking down.",
 w:"Past that point it produces irritants and off flavours. Extra virgin olive oil smokes around 190 degrees, refined oils higher.",
 a:["If a pan smokes before the food goes in, take it off the heat and start again rather than pushing through."]},

{id:"microwave-nutrients",c:"cooking",t:"Microwaving keeps more nutrients than boiling.",
 w:"Vitamins are lost to heat and to water. Microwaving uses less of both, so boiled broccoli loses more vitamin C than microwaved.",
 a:["Microwave or steam vegetables with a tablespoon of water and a lid. Boiling in a pan leaks vitamins into water you pour away.", "If you do boil, use the water for soup or gravy. The vitamins are in it."]},

{id:"frozen-vegetables",c:"food",t:"Frozen vegetables often beat fresh on nutrients.",
 w:"They are frozen within hours of picking, while fresh produce can spend a week in transport and storage losing vitamin C the whole way.",
 a:["Buy frozen for anything you will not eat within 2 days. It is often more nutritious than fresh that sat in the fridge a week.", "Frozen peas, spinach, berries and broccoli are the ones where frozen beats fresh most clearly."]},

{id:"food-poisoning-danger-zone",c:"food safety",t:"Bacteria multiply fastest between 5 and 60 degrees.",
 w:"In that range a single bacterium can become millions in a few hours. Cooked food left out is the classic route.",
 a:["Two hours out is the working limit, one hour if it is hot weather.",
    "Cool leftovers fast in a shallow dish rather than a deep pot, then refrigerate."]},

{id:"rice-bacillus",c:"food safety",t:"Reheating does not fix rice that sat out.",
 w:"Spores survive cooking and produce a toxin at room temperature. The toxin is not destroyed by heat, so reheating harder does nothing.",
 a:["Cool rice within an hour and refrigerate. Use within a day."]},

{id:"honey-infants",c:"food safety",t:"No honey before a baby's first birthday.",
 w:"It can carry dormant botulism spores. An adult gut suppresses them easily. An infant gut has not yet built the bacteria that do that, and the illness is severe.",
 a:["No honey at all before the first birthday, including in baking, cereal, and on a dummy.", "After 1 year it is fine. The gut has the bacteria to deal with the spores by then."]},

{id:"chicken-washing",c:"food safety",t:"Washing raw chicken spreads bacteria around your kitchen.",
 w:"Water droplets carry campylobacter up to half a metre onto surfaces and clothes. Cooking kills what is on the meat anyway.",
 a:["Do not rinse it. Pat dry with kitchen paper if you need to, and bin the paper."]},

{id:"cutting-board-cross-contamination",c:"food safety",t:"The board is a more common cause of illness than the meat.",
 w:"Raw juices left on a surface transfer to whatever is chopped next, usually salad that will not be cooked.",
 a:["Cut salad and bread before raw meat, not after, if you only have one board."]},

{id:"leftovers-cooling",c:"food safety",t:"Hot food in the fridge warms everything around it.",
 w:"A deep pot of stew can sit in the risky temperature range for hours even inside a cold fridge.",
 a:["Split it into shallow containers first. Surface area is what makes it cool fast."]},

{id:"exercise-first-hour",c:"exercise",t:"The first hour of exercise each week buys the most.",
 w:"Guidelines say 150 to 300 minutes a week, but the biggest drop in risk comes right at the start. Going from nothing to a little is the biggest single step you will ever take.",
 a:["If you do nothing now, aim at 15 minutes three times a week rather than a programme you will abandon."]},

{id:"steps-10000-myth",c:"walking",t:"The 10,000 step target came from a 1965 pedometer's name.",
 w:"It was sold in Japan as the ten thousand step meter. In large studies the drop in death rates flattens somewhere around 7,500 to 9,000, and most of the gain arrives well before that.",
 a:["Add 1,000 steps to whatever you do now rather than aiming at a number someone else made up.", "If you are under 5,000 a day, getting to 7,500 is where most of the health gain lives. Past 9,000 it flattens."]},

{id:"grip-strength",c:"strength",t:"Your grip predicts your lifespan better than your blood pressure.",
 w:"In a study of 140,000 people, every 5kg of lost grip came with a 16% higher chance of dying during the study. Your hands are not the point. Grip stands in for how much muscle you have left.",
 a:["Hang off a bar until you have to let go. Twice a week. 30 seconds is a fine start.",
    "Carry something heavy in each hand for 40 metres without setting it down. Shopping counts.",
    "Stand up from a chair ten times without using your hands."]},

{id:"muscle-loss-decades",c:"muscle",t:"You lose 3 to 8% of your muscle each decade after 30.",
 w:"It speeds up after 60. Strength training rebuilds part of it at any age, including in people in their nineties, because muscle responds to being worked, not to being young.",
 a:["Two sessions a week of anything that makes muscles work against resistance. Bodyweight, bands or weights all count.", "The test: can you get up from a chair 10 times in 30 seconds without using your hands? If not, start there."]},

{id:"doms-not-lactic",c:"exercise",t:"The ache two days after training is not lactic acid.",
 w:"Lactate clears from your blood within an hour. Soreness peaking at 24 to 72 hours is small tears in the fibres and the repair work around them.",
 a:["Light movement the next day reduces it. Complete rest usually makes it feel worse."]},

{id:"warm-up-vs-stretch",c:"exercise",t:"Stretching before exercise barely prevents injury. Warming up does.",
 w:"Holding a stretch cold has little effect on injury rates in trials. Warming the muscle up and rehearsing the movement you are about to do is what gets it ready to work.",
 a:["Five minutes of the thing you are about to do, slower and lighter, beats any stretch routine."]},

{id:"resting-heart-rate",c:"heart",t:"A fitter heart does the same work with fewer beats.",
 w:"Typical resting rates are 60 to 100, and trained endurance athletes often sit in the 40s. Their hearts push more blood per beat.",
 a:["Measure it in bed before getting up, three mornings running. A rise of 7 or more beats over your normal often means you are unwell or underslept."]},

{id:"vo2-max",c:"fitness",t:"How much oxygen you can use is one of the strongest predictors of lifespan.",
 w:"Stronger than smoking status in some large studies. The biggest gain comes from moving off the bottom rung, not from reaching the top.",
 a:["Once a week, do something that leaves you too breathless to talk, for 20 to 30 minutes total. Brisk hill walking counts.", "Most smartwatches estimate this number. Watch the trend over months, not the day to day figure."]},

{id:"sitting-breaks",art:"legsugar",c:"sitting",t:"Three minutes of walking every half hour flattens the sugar spike after a meal.",
 w:"Working leg muscles pull sugar out of your blood on their own, without needing insulin to do it. Standing still does much less than walking.",
 a:["Take calls standing or walking. It is the easiest swap in an office day."]},

{id:"breathing-exhale",art:"exhale",c:"breathing",t:"Breathing out longer than you breathe in slows your heart in seconds.",
 w:"A nerve running from brainstem to gut brakes the heart during the out breath and releases it during the in breath. A longer exhale gives the brake more time.",
 a:["In for 4, out for 6, five times. That is the whole technique.",
    "It works standing in a queue. No app needed."]},

{id:"cold-water-face",c:"reflexes",t:"Cold water on your face slows your heart. Cold on your hand does not.",
 w:"Nerves around the nose and eyes trigger a reflex we share with seals and dolphins: the heart slows and blood moves towards the brain.",
 a:["Cold water on the face for 30 seconds is a fast way to interrupt a panic spike."]},

{id:"blood-pressure-silent",c:"blood pressure",t:"High blood pressure has no symptoms until it has done damage.",
 w:"About a third of people who have it do not know. It is two numbers: pressure while the heart pushes, over pressure between beats.",
 a:["Get it measured once a year from 40, or now if it has been longer than that.",
    "Home monitors: sit for 5 minutes, arm at heart height, take two readings a minute apart."]},

{id:"cholesterol-types",c:"heart",t:"Cholesterol is not one number and not simply bad.",
 w:"Your body makes it and needs it for cell walls and hormones. What matters is how it travels. It rides in two kinds of carrier: one, called LDL, drops it off in artery walls, the other, HDL, picks it up again.",
 a:["Ask for the full breakdown, not the total: LDL, HDL and triglycerides, which are blood fats. If the letters mean nothing to you, ask what each should be and which way yours are off.", "Get it checked from 40, or earlier if a parent had heart trouble before 60. It is a fingerprick or one blood tube."]},

{id:"statins-basics",c:"medicine",t:"Statins work by slowing the liver's own cholesterol production.",
 w:"Most cholesterol in your blood is made by you rather than eaten, which is why diet alone shifts it less than people expect.",
 a:["Muscle aches are the usual complaint. In trials where nobody knew who had the real tablet, people on the dummy tablet reported aches just as often. Ask to try a different statin before stopping."]},

{id:"heart-attack-women",c:"emergency",t:"A heart attack in a woman often looks nothing like the films.",
 w:"Nausea, breathlessness, or jaw and back pain are more common than crushing chest pain. The classic description came mostly from studies of men, and women get diagnosed later because of it.",
 a:["Call an ambulance for unexplained crushing pressure, breathlessness, or nausea with cold sweat.",
    "Do not drive yourself or wait to see if it passes."]},

{id:"afib-pulse-check",c:"heart",t:"An irregular pulse is worth 30 seconds of your attention.",
 w:"Atrial fibrillation, a common rhythm fault, makes the heartbeat irregular, often with no symptoms, and multiplies stroke risk about fivefold. It is treatable once found.",
 a:["Feel your pulse at the wrist for 30 seconds occasionally. Irregular with no pattern is the thing to report.",
    "Most smartwatches check this automatically. Worth turning on if you have one."]},

{id:"stroke-timing",c:"emergency",t:"With a stroke, the minute it started is part of the treatment.",
 w:"Clot busting drugs work best inside 4.5 hours of the first symptom, and doctors cannot give them without knowing when that was. Someone who woke up with it often misses out.",
 a:["Ask them to smile, raise both arms, repeat a sentence. Watch for one side failing.",
    "Call an ambulance and say the word stroke. It changes which hospital they go to.",
    "Write down the time it started and tell the crew that first.",
    "No aspirin, no food, no lying down to see how it goes."]},

{id:"cpr-rate",c:"emergency",t:"Chest compressions run at 100 to 120 a minute, about two a second.",
 w:"Push 5 to 6cm deep in the centre of the chest. Most untrained rescuers go too slow and too shallow, and doing it imperfectly beats not doing it.",
 a:["Call for help and start pushing. Mouth to mouth is optional for untrained rescuers.",
    "Let the chest come all the way back up between pushes. That is when the heart refills."]},

{id:"defibrillator-access",c:"emergency",t:"A defibrillator will not shock someone who does not need it.",
 w:"It reads the heart rhythm first and refuses if a shock would not help, so you cannot hurt someone by attaching one. Survival roughly doubles when one is used early.",
 a:["Look up where the nearest one is now, before you need it. Most countries have a public map.",
    "It talks you through every step out loud. No training required."]}
];

/* Batch 3: myths, skin and teeth, medicines, mind and mood, safety. */
const FACTS_3 = [
{id:"outdoor-time-myopia",c:"eyes",t:"Children who play outdoors are less likely to need glasses for distance.",
 w:"Bright outdoor light seems to slow the eyeball growing too long front to back, which is what causes distance blur. Trials use about two hours a day.",
 a:["Daylight matters more than limiting screens. Outdoor time is the part with trial evidence behind it."]},

{id:"enamel-no-repair",c:"teeth",t:"Never brush straight after something acidic.",art:"tooth",
 w:"Acid softens the surface for about 30 minutes. Tooth enamel has no living cells in it, so whatever you scrub off is gone permanently.",
 a:["Rinse with water, wait 30 minutes, then brush.",
    "Sipping does more damage than drinking it down. A can over an hour keeps your teeth soft the whole hour.",
    "Fluoride 1350ppm or higher, printed on the tube. Spit after brushing, do not rinse."]},

{id:"gum-disease-heart",c:"teeth",t:"Gum disease keeps turning up alongside heart disease.",
 w:"Bacteria from swollen gums get into the bloodstream, and the same kind of irritation shows up in artery walls. Whether one causes the other is still unsettled.",
 a:["Gums that bleed when you brush are not normal. That is the sign to act on."]},

{id:"flossing-evidence",c:"teeth",t:"Flossing has weak evidence for cavities and decent evidence for gums.",
 w:"Trials are short and small, which is why headlines periodically declare it useless. Cleaning between teeth clearly reduces sore, swollen gums.",
 a:["Interdental brushes beat floss where the gaps are big enough to take one.",
    "Once a day is the target. Doing it badly every day beats doing it perfectly on Sundays."]},

{id:"mouthwash-timing",c:"teeth",t:"Mouthwash straight after brushing washes the fluoride away.",
 w:"Toothpaste leaves a fluoride layer on the teeth. Rinsing with anything, including water, removes most of it.",
 a:["Use mouthwash at a different time of day from brushing, or not at all."]},

{id:"toothbrush-pressure",c:"teeth",t:"Brushing harder wears away gum, not plaque.",
 w:"Plaque is soft and comes off with light contact. Pressure and stiff bristles cause receding gums and sensitive necks of teeth.",
 a:["Hold the brush in your fingertips rather than your fist. Soft bristles, 2 minutes, small circles."]},

{id:"sunscreen-spf-numbers",art:"sunscreen",c:"sun",t:"SPF 30 blocks 97% and SPF 50 blocks 98%.",
 w:"The gap between the numbers is small. The gap between the label and what you get is not, because most people apply a quarter to half the amount used in testing.",
 a:["A teaspoon for your face and neck, a shot glass for your body. Most people use far less.",
    "Reapply every two hours outdoors. Water resistant means 40 minutes swimming, not all day."]},

{id:"uva-through-glass",c:"sun",t:"One kind of sunlight comes straight through your window.",
 w:"The burning wavelength is mostly stopped by glass. The ageing one passes through, which is why drivers in some countries show more sun damage on the window side of their face.",
 a:["Sunscreen on the window side of your face and arm if you drive daily. Most car glass blocks the burning rays and lets ageing rays through.", "Office desk by a window? The same applies. UVA reaches you through it all day."]},

{id:"mole-abcde",c:"skin",t:"With a mole, change is the signal that matters most.",
 w:"The checklist is asymmetry, an irregular border, uneven colour, over 6mm across, and evolving. The last one carries the most weight.",
 a:["Photograph anything you are unsure about next to a ruler, then compare in a month.",
    "A mole that itches, bleeds or looks different from all your others is worth showing someone."]},

{id:"sunglasses-uv",c:"eyes",t:"Dark sunglasses without UV protection are worse than none.",
 w:"Darkness makes your pupil open wider. If the lens does not block ultraviolet, more of it reaches the inside of your eye than in bright squinting light.",
 a:["Look for UV400 or 100% UV. Price and darkness tell you nothing about it."]},

{id:"vitamin-d-vs-burn",c:"sun",t:"You make your day's vitamin D long before you burn.",
 w:"Short exposure on bare arms is enough for most skin in summer. Staying out until you go pink adds damage without adding vitamin D, because production plateaus.",
 a:["In summer, 10 to 20 minutes around midday with forearms and face bare makes your daily dose. Then cover or shade.", "Darker skin needs longer, lighter skin less. Whatever your skin, never let it reach pink."]},

{id:"dandruff-fungus",c:"skin",t:"Dandruff is usually a yeast, not dryness.",
 w:"A yeast that lives on everyone's skin overgrows and irritates the scalp in some people. That is why moisturising shampoo does nothing and antifungal shampoo works.",
 a:["Look for ketoconazole, selenium sulfide or zinc pyrithione, and leave it on 5 minutes before rinsing."]},

{id:"acne-not-chocolate",c:"skin",t:"Chocolate and greasy food do not cause spots.",
 w:"Acne is oil, dead cells and bacteria blocking follicles, driven mostly by hormones. Diet effects are small and mainly linked to high sugar loads and possibly skimmed milk.",
 a:["Scrubbing harder makes it worse by inflaming the skin further.",
    "Anything still bad after 3 months of over the counter treatment is worth a prescription rather than more products."]},

{id:"eczema-barrier",c:"skin",t:"Eczema is a leaky skin barrier, not just an itch.",
 w:"The skin loses water and lets irritants in, which sets off the redness and itch. That is why moisturiser is treatment rather than comfort.",
 a:["Apply moisturiser within 3 minutes of getting out of the bath, on damp skin.",
    "Use it every day, including when the skin looks fine. That is what prevents flares."]},

{id:"hand-cream-timing",c:"skin",t:"Moisturiser works by trapping water, so damp skin first.",
 w:"Most of what it does is slow evaporation. On bone dry skin there is much less to hold in.",
 a:["Apply within 3 minutes of washing your hands, while they are still damp. It seals water in instead of sitting on dry skin.", "Keep a tube by every sink you use. The timing only works if the cream is where the water is."]},

{id:"antibiotics-viruses",c:"medicine",t:"Antibiotics do nothing to a cold, because colds are viruses.",
 w:"Antibiotics attack structures only bacteria have, such as their cell wall. Viruses have none of them. Taking them anyway gives you the side effects and helps resistant bacteria spread.",
 a:["For a cold, sore throat or cough, ask the doctor one question: is this likely viral? If yes, antibiotics will not help.", "Colds last 7 to 10 days and a cough can last 3 weeks. Not improving after that is when to go back."]},

{id:"antibiotic-course-length",c:"medicine",t:"Finish the course is being reconsidered, but not by you at home.",
 w:"For some infections shorter courses now work as well, and the advice varies by condition. What has not changed is that the length should be decided by the prescriber rather than by how you feel on day three.",
 a:["Ask at the time how long it should be and why. That is a reasonable question."]},

{id:"paracetamol-limit",c:"medicine",t:"Paracetamol has a narrow gap between the normal dose and liver damage.",
 w:"The adult maximum is about 4g a day and harm can begin not far above it. It also hides inside cold and flu sachets and combination painkillers.",
 a:["Check every other medicine in the cupboard for paracetamol before adding a dose.",
    "Overdose has almost no symptoms on day one and is treatable early. Never wait to see."]},

{id:"ibuprofen-stomach",c:"medicine",t:"Ibuprofen blocks the chemical that protects your stomach lining.",
 w:"The same action that reduces pain and swelling slows the lining's constant rebuild, which is why long use causes ulcers and bleeding.",
 a:["Take it with food, use the lowest dose that works, and avoid it for more than a few days without advice.",
    "Avoid it entirely if you have kidney disease, heart failure, or are dehydrated."]},

{id:"grapefruit-interaction",c:"medicine",t:"Grapefruit can turn one tablet into three.",
 w:"It blocks a chemical in your gut that normally destroys part of a tablet before it reaches your blood, and the block lasts more than a day. Dozens of drugs are affected, including some statins and blood pressure medicines.",
 a:["Spacing them apart does not help. If your leaflet mentions grapefruit, avoid it entirely."]},

{id:"expiry-dates-medicines",c:"medicine",t:"Most tablets lose potency after expiry rather than turning dangerous.",
 w:"Testing of old stockpiles found many still fully potent years later. The exceptions matter though: liquid antibiotics, insulin, angina sprays and anything stored hot or damp.",
 a:["Never gamble on an out of date rescue medicine such as an inhaler or adrenaline pen."]},

{id:"nocebo-effect",c:"mind",t:"Reading side effects makes you more likely to get them.",
 w:"In trials where nobody knew who got the real drug, people on the dummy pill still reported a large share of the listed side effects. It is a real experience, not imagination.",
 a:["Worth knowing before you stop a medicine that is helping. Ask whether trying it again is sensible."]},

{id:"vaccine-soreness",c:"immunity",t:"A sore arm after a vaccine is the response being built.",
 w:"Immune cells arriving at the injection site cause the ache and the tiredness. It is not a mild version of the disease, and no reaction does not mean it failed.",
 a:["Move the arm. Using it gets blood flowing and shortens the ache.", "Do not take painkillers before the jab to prevent soreness. After, if you need them, is fine."]},

{id:"flu-vaccine-timing",c:"immunity",t:"Flu protection peaks about two weeks after the jab and fades over months.",
 w:"That is why timing is a compromise between covering the season and still working at the end of it.",
 a:["Autumn is the usual sweet spot in the northern hemisphere. Later is still better than not at all."]},

{id:"handwashing-soap",c:"hygiene",t:"Soap does not poison germs. It rips their coat apart.",
 w:"Many viruses are wrapped in a fatty envelope. One end of a soap molecule grabs fat, the other grabs water, so the envelope is prised open and rinsed away. That takes contact time, which is where 20 seconds comes from.",
 a:["20 seconds with soap. Count it the first few times, it is longer than most people think.", "The moments that matter most: before eating, after the toilet, and when you get home from public transport."]},

{id:"cold-air-nose",c:"colds",t:"Cold air does not give you a cold. It does weaken your nose.",
 w:"A 2022 study found that cooling the inside of the nose by about 5 degrees cut its defence against viruses by nearly half. The virus still has to arrive.",
 a:["In cold weather, pull a scarf or mask over your nose. It keeps the lining warm enough to keep working.", "Breathe through your nose rather than your mouth outdoors. The nose warms air before it reaches your throat."]},

{id:"sneeze-distance",art:"sneeze",c:"hygiene",t:"A sneeze throws droplets several metres in a fraction of a second.",
 w:"High speed imaging shows a cloud that carries much further than the old one metre guidance assumed.",
 a:["Into your elbow, not your hand, and not into open air."]},

{id:"humidity-and-viruses",c:"colds",t:"Dry indoor air helps respiratory viruses in two ways.",
 w:"Droplets shrink and stay airborne longer, and the mucus lining your airway works less well when dry. Winter heating is the usual cause.",
 a:["Aim for 40 to 60 percent humidity indoors in winter. A 10 dollar hygrometer tells you where you are.", "No humidifier? A bowl of water on a radiator, or drying laundry indoors, moves the number."]},

{id:"loneliness-risk",c:"social",t:"Weak social connection carries a death risk on the scale of major physical risks.",
 w:"Across studies of more than 300,000 people, those with few close ties were 26 to 32% more likely to die during the study. Age and starting health were taken into account.",
 a:["Regularity beats intensity. A standing weekly thing does more than occasional big efforts.",
    "Doing something alongside someone tends to work better than meeting to talk."]},

{id:"nature-120-minutes",c:"outdoors",t:"Two hours a week in green space tracks with better wellbeing.",
 w:"In a study of nearly 20,000 people, wellbeing improved from 120 minutes a week. One long visit or several short ones made no difference.",
 a:["Two hours a week in green space. It does not need to be one block: three 40 minute walks in a park count.", "Book it like an appointment. The people who hit the number in the study were not the ones who left it to chance."]},

{id:"exercise-and-mood",c:"mind",t:"Exercise compares well with antidepressants for mild to moderate depression.",
 w:"Trials find benefits of a similar size, though exercise studies are harder to run fairly and more people drop out. It works best added to treatment, not instead of it.",
 a:["Anything that raises your breathing counts. Group or outdoor activity performs slightly better in trials."]},

{id:"breathing-anxiety",c:"mind",t:"Slow breathing calms you through your nerves, not your thoughts.",
 w:"A long out breath activates the system that brakes the heart, so the physical part of the panic settles even when the worry does not.",
 a:["In for 4, out for 6, for two minutes. The longer out breath is the part that does the work."]},

{id:"rumination-vs-reflection",c:"mind",t:"Going over a problem helps only if the question changes.",
 w:"Asking why did this happen to me tends to loop. Asking what will I do next tends to resolve. The difference shows up in studies as rumination against reflection.",
 a:["If you have thought the same sentence twice, write down one next action instead of thinking it a third time."]},

{id:"hearing-loss-and-dementia",c:"hearing",t:"Untreated hearing loss is one of the largest changeable dementia risks.",
 w:"The link is consistent in large studies, and a 2023 trial found hearing aids slowed the decline in memory and thinking in people already at high risk. Cause is not fully settled.",
 a:["Struggling in restaurants is the early sign, long before quiet conversation gets hard.",
    "Free hearing tests are widely available. Average delay before people act is around 10 years."]},

{id:"smoking-quit-timeline",c:"smoking",t:"Your body starts repairing 20 minutes after the last cigarette.",
 w:"Heart rate and blood pressure fall almost immediately. After a year the extra risk of heart disease is roughly halved, and after 15 years it is close to someone who never smoked.",
 a:["Nicotine patches plus gum or lozenges, together, roughly double your chance of quitting compared with willpower alone.", "Set a quit date within 2 weeks and tell someone. Most countries have a free phone line that improves success again."]},

{id:"vaping-unknowns",c:"smoking",t:"Vaping is clearly less harmful than smoking and not established as safe.",
 w:"It avoids the tar and most combustion products, and it helps some people quit. Long term effects are unknown because it has not existed long enough to measure them.",
 a:["If you do not smoke, do not start vaping. There is no health reason to.", "If you smoke, switching fully to vaping is safer. Then set a date to stop vaping too, rather than treating it as the finish line."]},

{id:"alcohol-and-cancer-risk",c:"alcohol",t:"Alcohol causes cancer. The evidence is as certain as it is for tobacco and asbestos.",
 w:"Being in the same group as tobacco says how sure the evidence is, not how big the harm is. The clearest links are breast, mouth, throat, liver and bowel, and the risk starts rising from light drinking, not only heavy.",
 a:["Risk rises from the first drink, not from heavy drinking. Fewer drinks per week is the lever, whatever the starting point.", "Two or more alcohol free days a week and no more than 14 units in total is the guideline most countries have landed on."]},

{id:"seatbelt-physics",c:"safety",t:"At 50km/h an unbelted passenger hits the windscreen with about 3.5 tonnes of force.",
 w:"Your body keeps the car's speed after the car stops. A belt spreads that over the strongest parts of your skeleton and stretches the stop over more time.",
 a:["Rear seat belts matter for the people in front too. An unbelted rear passenger can kill the driver."]},

{id:"helmet-evidence",c:"safety",t:"Cycle helmets cut serious head injury by roughly two thirds in crashes.",
 w:"The foam crushes and slows your head over a few extra milliseconds. That is all a helmet does, and it is why one that has taken one knock is finished.",
 a:["Replace after any crash, even if it looks fine. The crushed foam does not spring back."]},

{id:"choking-back-blows",c:"emergency",t:"For choking, start with hard back blows, not the abdominal thrust.",
 w:"Current guidance is five sharp blows between the shoulder blades with the person leaning forward, then five abdominal thrusts, alternating.",
 a:["If they can cough or speak, let them cough. Intervene when the cough goes silent.",
    "Anyone who has had abdominal thrusts should be checked afterwards for internal injury."]},

{id:"burns-cool-water",art:"burn",c:"emergency",t:"A burn needs 20 minutes of cool running water, not ice.",
 w:"Cooling limits how deep the damage goes, and it still helps up to three hours later. Ice damages tissue further and can worsen the burn.",
 a:["Remove rings and watches before swelling starts.",
    "Cover loosely with cling film afterwards. No butter, no toothpaste, no creams."]},

{id:"nosebleed-position",art:"nosebleed",c:"emergency",t:"For a nosebleed, lean forward. Tipping the head back sends blood down your throat.",
 w:"Most bleeds come from the soft front part of the wall between your nostrils, which you can press on directly.",
 a:["Pinch the soft part just below the bony bridge for 10 minutes without checking.",
    "Over 20 minutes, or after a head injury, needs medical help."]},

{id:"sprain-price-protocol",c:"injury",t:"Ice for a sprain is now advised only briefly, and never as the whole plan.",
 w:"Advice has moved from rest and ice towards protecting it, then moving it gently and early, because the swelling that ice damps down is part of how the tissue heals.",
 a:["First 48 hours: protect it, avoid ibuprofen type painkillers if you can, keep it moving gently.",
    "Cannot bear weight on it at all? That needs an x ray to rule out a fracture."]},

function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

const LANGS=["en","zh"];
const L=()=>TR[state.lang]||TR.en;
const catLabel=k=>L().cats[k]||CATS[k].label;

/* Display text for a fact in the current language, falling back per field.
   A step list of a different length falls back whole, so the numbering can
   never disagree with the English. */
function txt(f){
  const tr=(L().facts||{})[f.id];
  if(!tr) return f;
  const a=(tr.a && f.a && tr.a.length===f.a.length)?tr.a:f.a;
  return {id:f.id,cat:f.cat,art:f.art,sub:f.sub,c:f.c,t:tr.t||f.t,w:tr.w||f.w,a:a};
}
const dayKey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

async function loadState(){
  const raw=await store.get();
  if(raw){ try{ Object.assign(state, JSON.parse(raw)); }catch(e){} }
  for(const k of ["saved","seen"]) if(!Array.isArray(state[k])) state[k]=[];
  if(typeof state.assigned!=="object"||!state.assigned) state.assigned={};
  if(!state.cycle) state.cycle=1;
  if(LANGS.indexOf(state.lang)<0) state.lang="en";
  /* drop saves and assignments pointing at facts that no longer exist */
  state.saved=state.saved.filter(id=>BY_ID[id]);
  state.seen=state.seen.filter(id=>BY_ID[id]);
  for(const d of Object.keys(state.assigned)) if(!BY_ID[state.assigned[d]]) delete state.assigned[d];
}
const persist=()=>store.set(JSON.stringify(state));

/* Today's fact is chosen once and written down. Adding facts later cannot move it. */
function factForToday(){
  const k=dayKey(new Date());
  if(state.assigned[k]) return BY_ID[state.assigned[k]];

  let pool=ORDER.filter(f=>!state.seen.includes(f.id));
  if(!pool.length){ state.cycle++; state.seen=[]; pool=ORDER.slice(); }   /* pool exhausted: start a review pass */

  /* not the same category as yesterday, when there is any other choice */
  const y=new Date(); y.setDate(y.getDate()-1);
  const prev=BY_ID[state.assigned[dayKey(y)]];
  if(prev){ const other=pool.filter(f=>f.cat!==prev.cat); if(other.length) pool=other; }

  /* rotate the starting point each cycle so a second pass is not the same order */
  const pick=pool[ hash("cycle"+state.cycle) % pool.length ];
  state.assigned[k]=pick.id;
  state.seen.push(pick.id);

  const keep=Object.keys(state.assigned).sort().slice(-120);   /* keep four months of history */
  const trimmed={}; keep.forEach(d=>trimmed[d]=state.assigned[d]);
  state.assigned=trimmed;
  persist();
  return pick;
}

function updateStreak(){
  const now=new Date(), k=dayKey(now);
  if(state.lastOpen===k) return;
  const y=new Date(now); y.setDate(y.getDate()-1);
  state.streak=(state.lastOpen===dayKey(y))?(state.streak||0)+1:1;
  state.lastOpen=k; persist();
}

/* Explanatory doodle where one exists, otherwise the subject's character. */
function artFor(f){
  if(f.art && ART[f.art])
    return '<figure class="doodle">'+ART[f.art].svg+'<figcaption>'+ART[f.art].cap+'</figcaption></figure>';
  const char=MASCOT_FOR[f.sub]||"body";
  const sp=SCENES[f.id];
  if(sp){
    const svg=scene(sp,CATS[f.cat].color,char);
    if(svg) return '<figure class="doodle">'+svg+'</figure>';
  }
  return "";   /* no honest picture for this fact: show none rather than a generic shape */
}
